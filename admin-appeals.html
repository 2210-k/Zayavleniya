<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оспаривания — Администрация</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-3"></script><script src="js/supabase.js?v=20260815-3"></script><style>.page{padding:32px 0}.head h1{margin:7px 0 8px}.list{display:grid;gap:12px;margin-top:24px}.card{border:1px solid var(--line);border-radius:16px;padding:20px;background:#101826}.card.pending{border-color:#80672c}.card h3{margin:0 0 7px}.meta{color:var(--muted);font-size:12px}.reason{margin:14px 0;padding:14px;border-radius:12px;background:#0b111c;white-space:pre-wrap;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn-success{background:#163a2b;color:#86e4b5;border-color:#285f48}.btn-danger{background:#391a1f;color:#ffadb4;border-color:#69323a}.btn-warning{background:#3b3018;color:#f6d37b;border-color:#665324}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px}.modal>div{max-width:500px;width:100%;background:#111a28;border:1px solid var(--line);border-radius:18px;padding:20px}.modal textarea,.modal input{width:100%;box-sizing:border-box;margin:10px 0;background:#0b121e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Оспаривания</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="admin.html">Обзор</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="head"><div class="eyebrow">КОНТРОЛЬ РЕШЕНИЙ</div><h1>Оспаривания</h1><p class="muted">Здесь принимаются решения по несогласию граждан с результатом рассмотрения.</p></div><div id="list" class="list"><p class="muted">Загрузка…</p></div></main></div><div id="modal" hidden class="modal"><div><h3 id="mt"></h3><p class="muted">Реальная дата фиксируется автоматически. Для решения укажите игровой день.</p><input id="day" type="number" min="0" step="1" placeholder="Игровой день"><textarea id="comment" rows="5" placeholder="Комментарий администрации"></textarea><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" id="confirm">Подтвердить</button></div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let selected=null,status=null;function closeModal(){modal.hidden=true}function openResolve(a,s){selected=a;status=s;mt.textContent=s==='accepted'?'Удовлетворить оспаривание':s==='rejected'?'Отклонить оспаривание':'Отменить оспаривание';day.value='';comment.value='';modal.hidden=false}confirm.onclick=async()=>{try{const d=Number(day.value);if(!Number.isInteger(d)||d<0)throw Error('Укажите корректный игровой день.');await ZB.resolveAppealAdmin(selected.id,status,comment.value.trim(),d);closeModal();boot()}catch(e){alert(e.message)}};async function boot(){const p=await ZB.requireAdmin();if(!p)return;logout.onclick=ZB.signOut;try{const a=await ZB.listAppealsAdmin();list.innerHTML=a.length?a.map(x=>`<article class="card ${x.status==='pending'?'pending':''}"><h3>⚖ ${esc(x.application_title||'Заявление')} · ${x.status==='pending'?'Требует внимания':esc(x.status)}</h3><div class="meta">№${String(x.application_number||'—').padStart(6,'0')} · ${esc(x.citizen_name||'Гражданин')} · ${new Date(x.created_at).toLocaleString('ru-RU')}</div><div class="reason">${esc(x.reason)}</div>${x.status==='pending'?'<div class="actions"><button class="btn btn-success" onclick=\'openResolve('+JSON.stringify(x)+',"accepted")\'>Удовлетворить</button><button class="btn btn-danger" onclick=\'openResolve('+JSON.stringify(x)+',"rejected")\'>Отклонить</button><button class="btn btn-secondary" onclick=\'openResolve('+JSON.stringify(x)+',"cancelled")\'>Отменить</button><a class="btn btn-secondary" href="admin-application.html?id='+x.application_id+'">Открыть дело</a></div>':'<div class="meta">Комментарий: '+esc(x.admin_comment||'—')+'</div>'}</article>`).join(''):'<p class="muted">Оспариваний пока нет.</p>'}catch(e){list.innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
