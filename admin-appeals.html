<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оспаривания — Ведомство</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-51"></script><script src="js/supabase.js?v=20260815-51"></script><style>
:root{--bg:#f4f6f8;--card:#fff;--line:#e3e7eb;--text:#17202a;--muted:#6b7580;--dark:#202a35;--danger:#a93b3b;--ok:#28734b;--shadow:0 12px 35px rgba(23,32,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.page{max-width:1200px;margin:auto;padding:28px}.topbar{background:#fff;border-bottom:1px solid var(--line);min-height:72px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px}.topbar-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn-primary{background:var(--dark);border-color:var(--dark);color:#fff}.btn-success{color:var(--ok);border-color:#b9d8c7;background:#fff}.btn-danger{color:var(--danger);border-color:#e3bcbc;background:#fff}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}.head{margin-bottom:24px}.head h1{font-size:30px;margin:7px 0}.muted{color:var(--muted);font-size:12px}.list{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.card.pending{border-left:4px solid #b8872c}.card h3{margin:0 0 8px;font-size:16px}.meta{font-size:11px;color:var(--muted)}.reason{margin:15px 0;padding:14px;background:#f6f7f8;border-radius:11px;white-space:pre-wrap;line-height:1.55;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{display:inline-block;padding:6px 9px;border-radius:8px;background:#eef1f4;font-size:10px;font-weight:800}.modal{position:fixed;inset:0;background:rgba(12,17,22,.55);display:grid;place-items:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modal-box{width:min(520px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal-box h2{margin:0 0 6px;font-size:20px}.modal-box input,.modal-box textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;font:inherit;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.case-link{font-weight:800;color:var(--text)}@media(max-width:650px){.page{padding:15px}.topbar{padding:0 14px}.topbar-actions .btn:first-child{display:none}.card{padding:16px}.actions .btn{flex:1}.modal-actions .btn{flex:1}}
</style></head><body><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Рабочее место ведомства</small></span></a><div class="topbar-actions"><a class="btn" href="admin.html">← Обзор</a><a class="btn" href="admin-applications.html">Заявления</a></div></header><main class="page"><section class="head"><div class="eyebrow">КОНТРОЛЬ РЕШЕНИЙ</div><h1>Оспаривания</h1><p class="muted">Здесь отображаются только обращения граждан, которые требуют решения ведомства.</p></section><div id="list" class="list"><p class="muted">Загрузка…</p></div></main><div id="modal" class="modal" hidden><div class="modal-box"><h2 id="modalTitle">Решение</h2><p id="modalCase" class="muted"></p><input id="day" type="number" min="0" placeholder="Игровой день решения"><textarea id="comment" rows="5" placeholder="Основание и комментарий администрации"></textarea><div class="modal-actions"><button class="btn" id="close">Отмена</button><button class="btn btn-primary" id="confirm">Подтвердить</button></div></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let selected=null,decision=null;const modal=document.getElementById('modal');const close=()=>{modal.hidden=true;selected=null;decision=null};document.getElementById('close').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});
function openResolve(item,status){selected=item;decision=status;document.getElementById('modalTitle').textContent=status==='accepted'?'Удовлетворить оспаривание':status==='rejected'?'Отклонить оспаривание':'Отменить оспаривание';document.getElementById('modalCase').textContent=`Дело №${String(item.application_number||'—').padStart(6,'0')} · ${item.application_title||'Заявление'} · ${item.citizen_name||'Гражданин'}`;document.getElementById('day').value='';document.getElementById('comment').value='';modal.hidden=false;setTimeout(()=>document.getElementById('day').focus(),0)}
document.getElementById('confirm').onclick=async()=>{try{const d=Number(document.getElementById('day').value);if(!Number.isInteger(d)||d<0)throw Error('Укажите корректный игровой день.');await ZB.resolveAppealAdmin(selected.id,decision,document.getElementById('comment').value.trim(),d);close();await boot()}catch(e){alert(e.message)}};
async function boot(){if(!await ZB.requireAdmin())return;try{const arr=await ZB.listAppealsAdmin();const pending=arr.filter(x=>x.status==='pending');const done=arr.filter(x=>x.status!=='pending');document.getElementById('list').innerHTML=arr.length?`<div class="muted">Требуют внимания: <b>${pending.length}</b> · Завершены: <b>${done.length}</b></div>`+arr.map(x=>{const pending=x.status==='pending';return `<article class="card ${pending?'pending':''}"><div class="meta">${pending?'ТРЕБУЕТ ВНИМАНИЯ':'ИСТОРИЯ'} · ${new Date(x.created_at).toLocaleString('ru-RU')}</div><h3>⚖ ${esc(x.application_title||'Заявление')}</h3><div class="meta">Дело №${String(x.application_number||'—').padStart(6,'0')} · ${esc(x.citizen_name||'Гражданин')}</div><div class="reason">${esc(x.reason)}</div>${pending?`<div class="actions"><button class="btn btn-success" data-action="accepted" data-id="${x.id}">Удовлетворить</button><button class="btn btn-danger" data-action="rejected" data-id="${x.id}">Отклонить</button><button class="btn" data-action="cancelled" data-id="${x.id}">Отменить</button><a class="btn btn-primary" href="admin-application.html?id=${encodeURIComponent(x.application_id)}">Открыть дело</a></div>`:`<div class="actions"><span class="status">${esc(x.status)}</span><a class="btn" href="admin-application.html?id=${encodeURIComponent(x.application_id)}">Открыть дело</a></div>`}</article>`}).join(''):'<div class="card"><p class="muted">Оспариваний пока нет.</p></div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const x=arr.find(i=>i.id===b.dataset.id);if(x)openResolve(x,b.dataset.action)})}catch(e){document.getElementById('list').innerHTML=`<div class="card"><b>Не удалось загрузить оспаривания</b><p class="muted">${esc(e.message)}</p></div>`}}boot();
</script></body></html>
