<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оспаривания — Центр управления</title><link rel="stylesheet" href="redesign-v2/css/admin-v2.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><style>.queue{display:grid;gap:10px}.appeal{padding:18px;border:1px solid #28333e;border-radius:15px;background:linear-gradient(180deg,#151e27,#111820)}.appeal.pending{border-color:#5b4b2c}.appeal h3{margin:7px 0 5px;font-size:14px}.reason{padding:12px;margin:13px 0;background:#0b1117;border:1px solid #28333e;border-radius:10px;white-space:pre-wrap;color:#b8c2cd;font-size:11px;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#020508c7;display:grid;place-items:center;padding:20px;z-index:50}.modal[hidden]{display:none}.box{width:min(480px,100%);background:#111820;border:1px solid #344252;border-radius:17px;padding:20px}.box input,.box textarea{width:100%;box-sizing:border-box;margin:7px 0;padding:11px;background:#0b1117;color:#eef2f5;border:1px solid #28333e;border-radius:9px}.box-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}</style></head><body><div class="v2-shell"><header class="v2-top"><a class="v2-brand" href="admin.html"><span class="v2-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Оспаривания · рабочая очередь</small></span></a><div class="v2-actions"><a class="v2-btn" href="admin.html">Обзор</a><a class="v2-btn" href="admin-applications.html">Заявления</a><button class="v2-btn" id="logout">Выйти</button></div></header><div class="v2-layout"><aside class="v2-side"><div class="v2-side-label">РАБОТА</div><nav class="v2-nav"><a href="admin.html">Обзор</a><a href="admin-applications.html">Заявления</a><a class="active" href="admin-appeals.html">Оспаривания</a><a href="admin-citizens.html">Граждане</a><a href="admin-messages.html">Сообщения</a><a href="admin-service.html">Обслуживание</a></nav></aside><main class="v2-main"><div class="v2-kicker">КОНТРОЛЬ РЕШЕНИЙ</div><h1 class="v2-title">Оспаривания</h1><p class="v2-sub">Отдельная очередь пересмотра решений. У каждого обращения есть причина, история и игровая дата решения.</p><div id="list" class="queue"><div class="v2-empty">Загрузка…</div></div></main></div></div><div id="modal" class="modal" hidden><div class="box"><h2 id="title">Решение</h2><p id="case" class="v2-sub"></p><input id="day" type="number" min="0" step="1" placeholder="Игровой день"><textarea id="comment" rows="5" placeholder="Основание решения"></textarea><div class="box-actions"><button class="v2-btn" id="close">Отмена</button><button class="v2-btn primary" id="ok">Подтвердить</button></div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let data=[],selected=null,decision=null;const $=id=>document.getElementById(id);function openDecision(x,s){selected=x;decision=s;$('title').textContent=s==='accepted'?'Удовлетворить оспаривание':s==='rejected'?'Отклонить оспаривание':'Отменить оспаривание';$('case').textContent=`Дело №${String(x.application_number||'').padStart(6,'0')} · ${x.application_title||'Заявление'} · ${x.citizen_name||'Гражданин'}`;$('day').value='';$('comment').value='';$('modal').hidden=false}$('close').onclick=()=>{$('modal').hidden=true};$('ok').onclick=async()=>{const b=$('ok');b.disabled=true;try{const d=Number($('day').value);if(!Number.isInteger(d)||d<0)throw Error('Укажите игровой день.');await ZB.resolveAppealAdmin(selected.id,decision,$('comment').value.trim(),d);$('modal').hidden=true;await load()}catch(e){alert('Не удалось вынести решение: '+e.message)}finally{b.disabled=false}};async function load(){if(!await ZB.requireAdmin())return;logout.onclick=ZB.signOut;try{data=await ZB.listAppealsAdmin();const p=data.filter(x=>x.status==='pending'),done=data.filter(x=>x.status!=='pending');$('list').innerHTML=`<div class="v2-card"><b>${p.length}</b> ожидают решения · <span class="v2-sub">${done.length} завершено</span></div>`+(data.length?data.map(x=>{const pending=x.status==='pending';return `<article class="appeal ${pending?'pending':''}"><div class="v2-kicker">${pending?'ТРЕБУЕТ РЕШЕНИЯ':'ИСТОРИЯ'} · ${x.created_at?new Date(x.created_at).toLocaleString('ru-RU'):''}</div><h3>⚖ ${esc(x.application_title||'Заявление')}</h3><div class="v2-sub">Дело №${String(x.application_number||'').padStart(6,'0')} · ${esc(x.citizen_name||'Гражданин')}</div><div class="reason">${esc(x.reason||'Причина не указана')}</div>${x.admin_comment?`<div class="reason"><b>Решение ведомства:</b> ${esc(x.admin_comment)}</div>`:''}<div class="actions">${pending?`<button class="v2-btn good" data-id="${x.id}" data-s="accepted">Удовлетворить</button><button class="v2-btn bad" data-id="${x.id}" data-s="rejected">Отклонить</button><button class="v2-btn" data-id="${x.id}" data-s="cancelled">Отменить</button>`:''}<a class="v2-btn" href="admin-application.html?id=${encodeURIComponent(x.application_id)}">Открыть дело</a></div></article>`}).join(''):'<div class="v2-empty">Оспариваний пока нет.</div>');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const x=data.find(v=>v.id===b.dataset.id);if(x)openDecision(x,b.dataset.s)})}catch(e){$('list').innerHTML='<div class="v2-empty">Ошибка: '+esc(e.message)+'</div>'}}load();</script></body></html>
