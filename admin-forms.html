<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Формы — Администрация</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-13"></script><script src="js/supabase.js?v=20260815-13"></script><style>.page{padding:32px 0}.builder{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.panel{padding:20px;border:1px solid var(--line);border-radius:16px;background:#101826}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;background:#0b121e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.fields{display:grid;gap:8px}.fieldrow{display:grid;grid-template-columns:1fr 130px 42px;gap:7px}.hint{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:800px){.builder{grid-template-columns:1fr}.fieldrow{grid-template-columns:1fr}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Конструктор форм</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="admin.html">Обзор</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="eyebrow">ДЕЛОПРОИЗВОДСТВО</div><h1>Формы от ведомства</h1><p class="muted">Создай собственную анкету, затем отправь её выбранному гражданину. Ответ возвращается в эту систему.</p><div class="builder"><section class="panel"><h2>Новая форма</h2><div class="field"><label>Название</label><input id="title" placeholder="Например: Дополнительная проверка кандидата"></div><div class="field"><label>Описание</label><textarea id="desc" rows="3"></textarea></div><h3>Поля</h3><div id="fields" class="fields"></div><button class="btn btn-secondary" id="add">＋ Добавить поле</button><button class="btn btn-primary" id="create" style="margin-top:14px">Создать форму</button></section><section class="panel"><h2>Отправить гражданину</h2><div class="field"><label>Форма</label><select id="template"></select></div><div class="field"><label>Гражданин</label><select id="citizen"></select></div><button class="btn btn-primary" id="send">Отправить форму</button><p class="hint">После отправки гражданин увидит форму в своём кабинете и сможет отправить ответ.</p></section></div></main></div><script>let fields=[];const $=id=>document.getElementById(id);function renderFields(){$('fields').innerHTML=fields.map((f,i)=>`<div class="fieldrow"><input value="${String(f.label).replace(/"/g,'&quot;')}" oninput="fields[${i}].label=this.value" placeholder="Название поля"><select onchange="fields[${i}].type=this.value"><option value="text" ${f.type==='text'?'selected':''}>Текст</option><option value="textarea" ${f.type==='textarea'?'selected':''}>Большой текст</option><option value="date" ${f.type==='date'?'selected':''}>Дата</option><option value="number" ${f.type==='number'?'selected':''}>Число</option></select><button class="btn btn-secondary" onclick="fields.splice(${i},1);renderFields()">×</button></div>`).join('')}function add(){fields.push({key:'field_'+Date.now(),label:'',type:'text',required:true});renderFields()}add.onclick=add;async function loadTemplates(){const t=await ZB.listAdminForms();$('template').innerHTML=t.length?t.map(x=>`<option value="${x.id}">${x.title}</option>`).join(''):'<option value="">Сначала создайте форму</option>'}async function boot(){if(!await ZB.requireAdmin())return;logout.onclick=ZB.signOut;try{const c=await ZB.listCitizensAdmin();$('citizen').innerHTML=c.map(x=>`<option value="${x.id}">${x.full_name||x.id}</option>`).join('');await loadTemplates()}catch(e){alert(e.message)}}$('create').onclick=async()=>{try{const fs=fields.filter(x=>x.label.trim()).map((x,i)=>({...x,key:x.key||'field_'+i}));if(!$('title').value.trim()||!fs.length)throw Error('Укажите название и хотя бы одно поле.');await ZB.createForm($('title').value.trim(),$('desc').value.trim(),fs);alert('Форма создана.');await loadTemplates()}catch(e){alert(e.message)}};$('send').onclick=async()=>{try{if(!$('template').value||!$('citizen').value)throw Error('Выберите форму и гражданина.');await ZB.sendForm($('template').value,$('citizen').value);alert('Форма отправлена гражданину.')}catch(e){alert(e.message)}};boot();</script></body></html>
