<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/auth.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="auth-page"><a class="brand" href="index.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Электронные заявления</small></span></a><main class="auth-card"><div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</div><h1>Вход в систему</h1><p class="muted">Используйте данные своей учётной записи.</p><form id="loginForm"><label>Email<input required name="login" type="email" autocomplete="username" placeholder="Введите email"></label><label>Пароль<input required name="password" type="password" autocomplete="current-password" placeholder="Введите пароль"></label><button class="btn btn-primary btn-large" type="submit">Войти</button><div id="error" class="auth-note" hidden></div></form><div class="auth-note">Учётные записи и безопасность работают через Supabase Auth.</div></main></div><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),err=document.getElementById('error'),btn=e.currentTarget.querySelector('button');btn.disabled=true;err.hidden=true;try{const r=await ZB.signIn(f.get('login'),f.get('password'));if(r.error)throw r.error;const p=await ZB.currentProfile();location.href=p?.role==='admin'?'admin.html':'dashboard.html'}catch(x){err.textContent=x.message||'Не удалось выполнить вход';err.hidden=false;btn.disabled=false}});</script></body></html>
