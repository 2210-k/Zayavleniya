<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/dashboard.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Профиль гражданина</small></span></a><button class="btn btn-secondary" id="logout">Выйти</button></header><main class="dashboard"><div class="eyebrow">ЛИЧНЫЕ ДАННЫЕ</div><h1>Профиль гражданина</h1><p class="muted">Данные сохраняются в вашей учётной записи и автоматически используются в заявлениях.</p><form id="profileForm"><section class="field-section" style="max-width:850px"><h2>Личные данные</h2><div class="fields"><div class="field"><label>ФИО</label><input name="full_name" required></div><div class="field"><label>Дата рождения</label><input name="birth_date" type="date"></div></div></section><section class="field-section" style="max-width:850px"><h2>Паспорт</h2><div class="fields"><div class="field"><label>Серия</label><input name="passport_series"></div><div class="field"><label>Номер</label><input name="passport_number"></div><div class="field full"><label>Кем выдан</label><input name="passport_issuer"></div><div class="field"><label>Дата выдачи</label><input name="passport_issue_date" type="date"></div></div></section><section class="field-section" style="max-width:850px"><h2>Гражданство</h2><div class="fields"><div class="field"><label>Гражданство</label><input name="citizenship"></div><div class="field"><label>Место рождения</label><input name="birth_place"></div><div class="field"><label>Национальность</label><input name="nationality"></div></div></section><section class="field-section" style="max-width:850px"><h2>Адрес</h2><div class="fields"><div class="field full"><label>Адрес проживания</label><input name="residence_address"></div><div class="field full"><label>Адрес регистрации</label><input name="registration_address"></div></div></section><button class="btn btn-primary btn-large" type="submit">Сохранить изменения</button> <span id="msg" class="muted"></span></form></main></div><script>const form=document.getElementById('profileForm'),msg=document.getElementById('msg');async function boot(){const p=await ZB.requireCitizen();if(!p)return;document.getElementById('logout').onclick=ZB.signOut;try{const x=await ZB.currentProfile();Object.keys(x||{}).forEach(k=>{const e=form.elements[k];if(e)e.value=x[k]??''})}catch(e){msg.textContent='Ошибка загрузки: '+e.message}}form.addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;try{const p=await ZB.currentProfile(),db=await ZB.getSupabase(),data={};['full_name','birth_date','passport_series','passport_number','passport_issuer','passport_issue_date','citizenship','birth_place','nationality','residence_address','registration_address'].forEach(k=>data[k]=form.elements[k].value||null);const {error}=await db.from('profiles').update(data).eq('id',p.id);if(error)throw error;msg.textContent='✓ Изменения сохранены';setTimeout(()=>msg.textContent='',2500)}catch(x){msg.textContent='Ошибка: '+x.message}finally{btn.disabled=false}});boot();</script></body></html>
