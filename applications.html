<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои заявления — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/dashboard.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Мои заявления</small></span></a><div class="topbar-actions"><span class="game-date" id="date"></span><button class="btn btn-secondary" id="logout">Выйти</button><a class="btn btn-primary" href="create-application.html">＋ Создать</a></div></header><main class="dashboard"><div class="eyebrow">ДОКУМЕНТООБОРОТ</div><h1>Мои заявления</h1><p class="muted">История ваших обращений в ведомство.</p><div class="filter-row"><span class="filter active">Все</span></div><section class="recent" id="list"><p class="muted">Загрузка…</p></section></main></div><script>const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function boot(){if(!await ZB.requireAuth())return;document.getElementById('logout').onclick=ZB.signOut;document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU')+' · реальная дата';try{const a=await ZB.listMyApplications();document.getElementById('list').innerHTML=a.length?a.map(x=>`<a class="application-row" href="application.html?id=${x.id}"><div><b>№${String(x.application_number).padStart(6,'0')}</b><strong>${esc(x.title)}</strong><small>${new Date(x.created_at).toLocaleDateString('ru-RU')} (${esc(x.submitted_game_day??'—')} день)</small></div><span class="status status-review">${esc(st[x.status]||x.status)}</span></a>`).join(''):'<p class="muted">У вас пока нет заявлений.</p>'}catch(e){document.getElementById('list').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
