<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои заявления — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/dashboard.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><style>.filters{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.filter{cursor:pointer;border:1px solid #303b47;background:#111820;color:#8996a4;padding:8px 11px;border-radius:999px;font-size:10px}.filter.active{background:#e8edf2;color:#10161c;border-color:#fff}.application-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px 18px!important}.application-row small{display:block;color:#687788}.row-dates{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}.row-date{font-size:9px;color:#778493}.row-date.game{color:#c9d1d8}@media(max-width:650px){.application-row{align-items:flex-start}.application-row .status{flex-shrink:0}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Мои заявления</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="dashboard.html">← Кабинет</a><a class="btn btn-primary" href="create-application.html">＋ Создать</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="dashboard"><div class="eyebrow">ДОКУМЕНТООБОРОТ</div><h1>Мои заявления</h1><p class="muted">Здесь хранится полный путь каждого документа: отправка → получение ведомством → рассмотрение → решение.</p><div class="filters" id="filters"></div><section class="recent" id="list"><p class="muted">Загрузка…</p></section></main></div><script>const st={all:'Все',submitted:'Отправлено',received:'Получено',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let apps=[],active='all';function statusClass(s){return 'status status-'+({submitted:'submitted',received:'received',reviewing:'review',approved:'approved',rejected:'rejected',postponed:'postponed',cancelled:'danger',appealed:'appealed'}[s]||'review')}function render(){document.getElementById('filters').innerHTML=Object.entries(st).map(([k,label])=>`<button class="filter ${active===k?'active':''}" data-filter="${k}">${label}${k==='all'?'':' · '+apps.filter(a=>a.status===k).length}</button>`).join('');const rows=apps.filter(a=>active==='all'||a.status===active);document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<a class="application-row" href="application.html?id=${encodeURIComponent(x.id)}"><div><b>№${String(x.application_number).padStart(6,'0')}</b><strong>${esc(x.title)}</strong><div class="row-dates"><span class="row-date">Реальная: ${new Date(x.real_submitted_at||x.created_at).toLocaleDateString('ru-RU')}</span><span class="row-date game">Игровой день: ${esc(x.submitted_game_day??'—')}</span></div></div><span class="${statusClass(x.status)}">${esc(st[x.status]||x.status)}</span></a>`).join(''):'<p class="muted">В этой категории заявлений нет.</p>'}async function boot(){const p=await ZB.requireCitizen();if(!p)return;logout.onclick=ZB.signOut;try{apps=await ZB.listMyApplications();render();document.getElementById('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;active=b.dataset.filter;render()}}catch(e){list.innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
