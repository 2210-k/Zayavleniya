<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Формы от ведомства</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-10"></script><script src="js/supabase.js?v=20260815-10"></script><style>.page{padding:32px 0}.list{display:grid;gap:12px;margin-top:22px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:#101826}.card h2{margin:0 0 7px}.meta{color:var(--muted);font-size:12px}.fields{display:grid;gap:12px;margin-top:18px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea{background:#0b121e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.field textarea{resize:vertical}.actions{display:flex;gap:8px;margin-top:15px}.answer{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Формы от ведомства</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="dashboard.html">Кабинет</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="eyebrow">ВХОДЯЩИЕ ФОРМЫ</div><h1>Формы от ведомства</h1><p class="muted">Если администрация направила вам анкету, заполните её здесь. Игровая дата для обычного ответа не требуется.</p><div id="list" class="list"><p class="muted">Загрузка…</p></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(forms){list.innerHTML=forms.length?forms.map(r=>{const fs=Array.isArray(r.fields)?r.fields:[];const editable=r.status==='pending';return `<article class="card"><h2>${esc(r.title)}</h2><p>${esc(r.description||'')}</p><div class="meta">Статус: ${esc(r.status)} · ${new Date(r.created_at).toLocaleString('ru-RU')}</div>${editable?`<form data-id="${r.id}" class="fields">${fs.map(f=>`<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label>${f.type==='textarea'?`<textarea name="${esc(f.key)}" rows="4" ${f.required?'required':''}></textarea>`:`<input name="${esc(f.key)}" type="${['date','number'].includes(f.type)?f.type:'text'}" ${f.required?'required':''}>`}</div>`).join('')}<button class="btn btn-primary" type="submit">Отправить ответ</button></form>`:r.status==='submitted'?`<div class="answer"><b>Ответ отправлен</b><p class="meta">Ведомство ещё не завершило рассмотрение.</p></div>`:`<div class="answer"><b>Форма обработана</b><p class="meta">${esc(r.admin_comment||'')}</p></div>`}</article>`}).join(''):'<p class="muted">Новых форм нет.</p>';document.querySelectorAll('form[data-id]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const response={};new FormData(f).forEach((v,k)=>response[k]=v);const b=e.submitter;b.disabled=true;try{await ZB.submitForm(f.dataset.id,response);await boot()}catch(err){alert(err.message)}finally{b.disabled=false}})}async function boot(){const p=await ZB.requireCitizen();if(!p)return;logout.onclick=ZB.signOut;try{render(await ZB.listCitizenForms())}catch(e){list.innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
