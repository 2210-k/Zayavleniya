<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявление — ГосПортал</title><link rel="stylesheet" href="css/main.css?v=20260821-3"><script src="js/supabase-config.js?v=20260821-3"></script><script src="js/supabase.js?v=20260821-3"></script><style>body{background:radial-gradient(circle at 80% -15%,#1b2835 0,transparent 35%),#080d14}.workspace{max-width:1260px;margin:auto;padding:26px 20px 70px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.hero h1{font-size:32px;letter-spacing:-.04em;margin:8px 0}.hero p{margin:0;color:#7f8c9b;font-size:11px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border:1px solid #2b3743;border-radius:999px;background:#111820;color:#9aa7b5;font-size:10px}.chip.game{color:#e4e9ee;border-color:#45525f;background:#17212b}.actions{display:flex;gap:7px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.card{background:linear-gradient(180deg,#151e27,#111820);border:1px solid #293541;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 35px #0002}.card h3{margin:0 0 10px;font-size:14px}.muted{color:#7d8b99;font-size:11px;line-height:1.5}.document{background:#fff;color:#15181c;border-radius:5px;padding:70px 76px;min-height:780px;box-shadow:0 24px 80px #0007;font-family:Georgia,'Times New Roman',serif;line-height:1.8;font-size:15px}.document .to{width:48%;margin-left:auto;margin-bottom:60px}.document .title{text-align:center;font-weight:700;font-size:19px;margin:30px 0}.document .body{text-align:justify}.document .meta{margin-top:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;font-family:Arial,sans-serif;font-size:11px}.timeline,.chat,.attachments{display:grid;gap:8px}.event{padding:11px;border-left:2px solid #3c4b58;background:#0d141b;border-radius:0 9px 9px 0;font-size:10px}.event b{display:block;color:#cfd7de}.event small{display:block;margin-top:4px;color:#7e8b98}.message{position:relative;max-width:92%;padding:10px 34px 10px 12px;border-radius:12px;border:1px solid #303b47;background:#0d141b;font-size:11px}.message.citizen{margin-left:auto;background:#1c2731}.message small{display:block;color:#71808e;font-size:9px;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;line-height:1.5}.message button{position:absolute;right:7px;top:7px;border:0;background:none;color:#82909e;cursor:pointer}.composer textarea,.appeal textarea{width:100%;box-sizing:border-box;background:#0b1117;color:#edf2f6;border:1px solid #303b47;border-radius:10px;padding:11px;resize:vertical;font:inherit;font-size:11px}.composer button{width:100%;margin-top:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #202a34;font-size:10px}.row:last-child{border-bottom:0}.attachment{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #2b3743;border-radius:10px;background:#0d141b;font-size:10px}.attachment a{color:#e3e9ee}.appeal-branch{border:1px solid #74592a;background:linear-gradient(180deg,#211b11,#17140e);border-radius:15px;padding:16px;margin-bottom:14px}.appeal-branch h3{color:#ead7aa}.appeal-status{display:inline-block;padding:5px 8px;border-radius:999px;background:#302613;color:#e6c77e;font-size:9px;font-weight:800}.withdraw{border-color:#5b3039}.notice{padding:11px;border:1px solid #31404c;background:#101821;border-radius:10px;color:#a8b3bd;font-size:10px;line-height:1.5}.empty{padding:28px;text-align:center;color:#758392;border:1px dashed #34414d;border-radius:11px;font-size:11px}@media print{body{background:#fff}.topbar,.hero .actions,aside,.card:not(.document-card){display:none!important}.workspace{padding:0}.document{box-shadow:none;border-radius:0;min-height:auto;padding:35mm 25mm}}@media(max-width:950px){.layout{grid-template-columns:1fr}.hero{flex-direction:column}.document{padding:40px 35px}}@media(max-width:600px){.workspace{padding:20px 14px 50px}.document{padding:28px 20px;min-height:500px;font-size:13px}.document .to{width:70%}.document .meta{grid-template-columns:1fr}.hero h1{font-size:26px}.actions .btn{flex:1}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Моё заявление</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="applications.html">← Заявления</a><button class="btn btn-secondary" onclick="history.back()">Назад</button><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="workspace"><div id="root"><div class="empty">Загрузка заявления…</div></div></main></div><script>const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),dt=x=>x?new Date(x).toLocaleString('ru-RU'):'—';const statuses={submitted:'Отправлено в ведомство',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отказано',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспаривание на рассмотрении'};async function boot(){const p=await ZB.requireCitizen();if(!p)return;if(!id){location.href='applications.html';return}$('logout').onclick=ZB.signOut;try{const [a,h,m,f,appeals]=await Promise.all([ZB.getApplication(id),ZB.getHistory(id),ZB.listMessages(id),ZB.listAttachments(id),ZB.listApplicationAppeals(id)]);await ZB.markApplicationMessagesRead(id);const pending=appeals.find(x=>x.status==='pending'),doc=a.generated_document?.trim()?a.generated_document:'<div class="empty"><b>Документ не сформирован.</b><br>Для новых заявлений предпросмотр сохраняется автоматически.</div>';const history=h.length?h.map(x=>`<div class="event"><b>${dt(x.real_date||x.created_at)} · игровой день ${esc(x.game_day??'—')}</b>${esc(x.action)}${x.comment?`<small>${esc(x.comment)}</small>`:''}</div>`).join(''):'<div class="empty">История пока пуста.</div>';const messages=m.length?m.map(x=>`<div class="message ${x.sender_id===p.id?'citizen':''}"><small>${x.sender_id===p.id?'Вы':'Ведомство'} · ${dt(x.created_at)}</small>${x.sender_id===p.id?`<button data-delete="${x.id}" title="Удалить">×</button>`:''}<p>${esc(x.message)}</p></div>`).join(''):'<div class="empty">Сообщений пока нет.</div>';const files=f.length?f.map(x=>`<div class="attachment"><span>📎 ${esc(x.file_name)}</span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<div class="muted">Вложений пока нет.</div>';const appealBranch=pending||appeals[0];const appealHtml=appealBranch?`<section class="appeal-branch"><div style="display:flex;justify-content:space-between;gap:10px"><h3>⚖ Ветка оспаривания</h3><span class="appeal-status">${appealBranch.status==='pending'?'НА РАССМОТРЕНИИ':appealBranch.status==='accepted'?'УДОВЛЕТВОРЕНО':appealBranch.status==='rejected'?'ОТКЛОНЕНО':'ЗАКРЫТО'}</span></div><div class="notice"><b>Ваша причина:</b><br>${esc(appealBranch.reason)}</div>${appealBranch.admin_comment?`<div class="notice" style="margin-top:8px"><b>Ответ ведомства:</b><br>${esc(appealBranch.admin_comment)}</div>`:''}</section>`:'';const canWithdraw=['submitted','received','reviewing','postponed'].includes(a.status);$('root').innerHTML=`<section class="hero"><div><div class="eyebrow">ЗАЯВЛЕНИЕ №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(statuses[a.status]||a.status)}</p><div class="chips"><span class="chip">Реальная: ${dt(a.real_submitted_at||a.created_at)}</span><span class="chip game">Игровой день: ${esc(a.submitted_game_day??'—')}</span></div></div><div class="actions"><button class="btn btn-secondary" id="print">🖨 Печать / PDF</button><button class="btn btn-secondary" id="copy">Копировать №</button>${canWithdraw?'<button class="btn btn-secondary withdraw" id="withdraw">Отозвать заявление</button>':''}</div></section>${appealHtml}<div class="layout"><section><article class="card document-card"><div class="document">${doc}</div></article><div class="card"><h3>Хронология дела</h3><div class="timeline">${history}</div></div><div class="card"><h3>Вложения</h3><div class="attachments">${files}</div></div>${['rejected','postponed'].includes(a.status)&&!pending?'<div class="card appeal-branch"><h3>⚖ Оспорить решение</h3><p class="muted">Оспаривание создаётся прямо внутри этого дела. После отправки здесь появится отдельная ветка с решением ведомства.</p><textarea id="reason" rows="5" maxlength="5000" placeholder="Почему вы не согласны с решением?"></textarea><button class="btn btn-primary" id="appeal" style="margin-top:8px">Подать оспаривание</button></div>':''}</section><aside><div class="card"><h3>Статус</h3><div class="row"><span>Отправлено</span><b>${dt(a.real_submitted_at||a.created_at)}</b></div><div class="row"><span>Получено</span><b>${a.real_received_at?dt(a.real_received_at)+' · день '+esc(a.received_game_day):'Ожидает'}</b></div><div class="row"><span>Рассмотрение</span><b>${a.real_review_started_at?dt(a.real_review_started_at)+' · день '+esc(a.review_started_game_day):'Не начато'}</b></div><div class="row"><span>Решение</span><b>${a.real_decision_at?dt(a.real_decision_at)+' · день '+esc(a.decision_game_day):'Не вынесено'}</b></div>${a.admin_comment?`<p class="muted"><b>Комментарий ведомства:</b><br>${esc(a.admin_comment)}</p>`:''}</div><div class="card"><h3>Переписка</h3><div class="chat">${messages}</div><form id="send" class="composer"><textarea id="text" rows="4" maxlength="4000" required placeholder="Напишите ведомству…"></textarea><button class="btn btn-primary">Отправить сообщение</button></form></div></aside></div>`;$('print').onclick=()=>window.print();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(String(a.application_number));$('copy').textContent='✓ Скопировано';setTimeout(()=>$('copy').textContent='Копировать №',1500)}catch(e){alert(a.application_number)}};document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();try{window.open(await ZB.attachmentUrl(x.dataset.file),'_blank','noopener')}catch(z){alert(z.message)}});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=async()=>{if(confirm('Удалить сообщение?')){try{await ZB.deleteOwnMessage(x.dataset.delete);await boot()}catch(e){alert(e.message)}}});$('send').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,$('text').value);await boot()}catch(x){alert('Не удалось отправить: '+x.message);b.disabled=false}};if($('appeal'))$('appeal').onclick=async()=>{const reason=$('reason').value.trim();if(reason.length<10)return alert('Причина должна содержать минимум 10 символов.');try{await ZB.createAppeal(id,reason);await boot()}catch(e){alert(e.message)}};if($('withdraw'))$('withdraw').onclick=async()=>{if(!confirm('Отозвать заявление? Это завершит его рассмотрение.'))return;const day=prompt('Укажите игровой день отзыва:','');if(day===null)return;const n=Number(day);if(!Number.isInteger(n)||n<0)return alert('Неверный игровой день.');const reason=prompt('Причина отзыва (необязательно):','');try{await ZB.withdrawApplication(id,n,reason||'');await boot()}catch(e){alert('Не удалось отозвать заявление: '+e.message)}}}catch(e){$('root').innerHTML='<div class="empty">Ошибка: '+esc(e.message)+'</div>'}}boot();</script></body></html>
