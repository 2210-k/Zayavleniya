<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявление — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin-application.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="applications.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Заявление</small></span></a><a class="btn btn-secondary" href="applications.html">← Мои заявления</a></header><main class="review-page"><div id="app"><p class="muted">Загрузка…</p></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function boot(){const p=await ZB.requireCitizen();if(!p)return;if(!id)return;try{const a=await ZB.getApplication(id),h=await ZB.getHistory(id);document.getElementById('app').innerHTML=`<div class="review-head"><div><div class="eyebrow">ЗАЯВЛЕНИЕ №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${new Date(a.created_at).toLocaleDateString('ru-RU')} (${esc(a.submitted_game_day??'—')} день)</p></div><span class="status status-review">${esc(st[a.status]||a.status)}</span></div><div class="review-grid"><aside><section class="info-card"><h3>Статус</h3><b>${esc(st[a.status]||a.status)}</b><span>Подано: ${new Date(a.created_at).toLocaleString('ru-RU')}</span>${a.real_received_at?'<span>Получено: '+new Date(a.real_received_at).toLocaleString('ru-RU')+' ('+esc(a.received_game_day)+' день)</span>':''}${a.real_review_started_at?'<span>Рассмотрение: '+new Date(a.real_review_started_at).toLocaleString('ru-RU')+' ('+esc(a.review_started_game_day)+' день)</span>':''}${a.real_decision_at?'<span>Решение: '+new Date(a.real_decision_at).toLocaleString('ru-RU')+' ('+esc(a.decision_game_day)+' день)</span>':''}${a.admin_comment?'<span>Комментарий ведомства: '+esc(a.admin_comment)+'</span>':''}</section><section class="info-card"><h3>История</h3><div class="timeline">${h.map(x=>`<span><b>${new Date(x.real_date).toLocaleDateString('ru-RU')} (${esc(x.game_day??'—')} день)</b>${esc(x.action)}${x.comment?'<small>'+esc(x.comment)+'</small>':''}</span>`).join('')}</div></section></aside><section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article>${['approved','rejected','postponed'].includes(a.status)?'<section class="actions"><h3>Оспорить решение</h3><p class="muted">Опишите, почему вы не согласны с решением ведомства.</p><textarea id="appealReason" rows="5" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ccd3dd"></textarea><button id="appeal" class="btn btn-primary btn-large" style="margin-top:12px">Подать оспаривание</button></section>':''}</section></div>`;document.getElementById('appeal')?.addEventListener('click',async()=>{const r=document.getElementById('appealReason').value.trim();if(!r)return alert('Укажите причину оспаривания.');try{await ZB.createAppeal(id,r);location.reload()}catch(e){alert(e.message)}})}catch(e){document.getElementById('app').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
