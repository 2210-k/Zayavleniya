<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявление — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin-application.css"><script src="js/supabase-config.js?v=20260815-31"></script><script src="js/supabase.js?v=20260815-31"></script><style>.message-panel{position:sticky;top:18px;background:#0d1522;border:1px solid #2c3744;border-radius:18px;padding:16px}.chat{display:flex;flex-direction:column;gap:9px;max-height:480px;overflow:auto;padding:5px}.message{max-width:88%;padding:11px 13px;border-radius:14px}.message.citizen{align-self:flex-end;background:#dfe4e8;color:#111820;border:1px solid #f2f4f6}.message.admin{align-self:flex-start;background:#1b2633;border:1px solid #344354;color:#edf2f6}.message small{display:flex;justify-content:space-between;gap:8px;font-size:9px;opacity:.7;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;line-height:1.5}.msg-delete{border:0;background:transparent;color:inherit;cursor:pointer;opacity:.65;font-size:10px}.message-form textarea{width:100%;box-sizing:border-box;background:#0a1119;color:#fff;border:1px solid #303b47;border-radius:12px;padding:12px;resize:vertical}.message-form button{width:100%;margin-top:8px}.attachments{margin-top:14px;padding:16px;border:1px solid #2b3642;border-radius:16px;background:#101820}.attachment-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #26313c;font-size:12px}.attachment-row:last-child{border-bottom:0}.attachment-row a{color:#dfe5eb}@media(max-width:1000px){.message-panel{position:static}}@media(max-width:650px){.message{max-width:94%}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Моё заявление</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="applications.html">← Мои заявления</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="review-page"><div id="app"><p class="muted">Загрузка…</p></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function boot(){const p=await ZB.requireCitizen();if(!p)return;if(!id){location.href='applications.html';return}logout.onclick=ZB.signOut;try{const a=await ZB.getApplication(id),h=await ZB.getHistory(id),msgs=await ZB.listMessages(id),atts=await ZB.listAttachments(id);const attHtml=atts.length?atts.map(x=>`<div class="attachment-row"><span>📎 ${esc(x.file_name)}</span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<span class="muted">Вложений пока нет.</span>';document.getElementById('app').innerHTML=`<div class="review-head"><div><div class="eyebrow">ЗАЯВЛЕНИЕ №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${new Date(a.created_at).toLocaleDateString('ru-RU')} · ${esc(a.submitted_game_day??'—')} день</p></div><span class="status status-review">${esc(st[a.status]||a.status)}</span></div><div class="review-grid"><aside><section class="info-card"><h3>Статус</h3><b>${esc(st[a.status]||a.status)}</b><span>Подано: ${new Date(a.created_at).toLocaleString('ru-RU')} · ${esc(a.submitted_game_day??'—')} день</span>${a.real_received_at?'<span>Получено: '+new Date(a.real_received_at).toLocaleString('ru-RU')+' · '+esc(a.received_game_day)+' день</span>':''}${a.real_review_started_at?'<span>Рассмотрение: '+new Date(a.real_review_started_at).toLocaleString('ru-RU')+' · '+esc(a.review_started_game_day)+' день</span>':''}${a.real_decision_at?'<span>Решение: '+new Date(a.real_decision_at).toLocaleString('ru-RU')+' · '+esc(a.decision_game_day)+' день</span>':''}${a.admin_comment?'<span>Комментарий ведомства: '+esc(a.admin_comment)+'</span>':''}</section><section class="info-card"><h3>История</h3><div class="timeline">${h.map(x=>`<span><b>${new Date(x.real_date||x.created_at).toLocaleDateString('ru-RU')} · ${esc(x.game_day??'—')} день</b>${esc(x.action)}${x.comment?'<small>'+esc(x.comment)+'</small>':''}</span>`).join('')||'<span>История пока пуста.</span>'}</div></section></aside><section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article><section class="attachments"><h3>📎 Вложения от ведомства</h3>${attHtml}</section>${['approved','rejected','postponed'].includes(a.status)?'<section class="actions"><h3>Оспорить решение</h3><p class="muted">Опишите причину несогласия.</p><textarea id="appealReason" rows="5" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ccd3dd"></textarea><button id="appeal" class="btn btn-primary btn-large" style="margin-top:12px">Подать оспаривание</button></section>':''}</section><aside class="message-panel"><h3>Переписка с ведомством</h3><p class="muted">Дата сообщения ставится автоматически.</p><div id="chat" class="chat">${msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===p.id?'citizen':'admin'}"><small><span>${esc(m.sender_id===p.id?'ВЫ':'ВЕДОМСТВО')} · ${new Date(m.created_at).toLocaleString('ru-RU')}</span>${m.sender_id===p.id?`<button class="msg-delete" data-mid="${m.id}">Удалить</button>`:''}</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Ведомство ещё не отправляло сообщений.</p>'}</div><form id="messageForm" class="message-form"><textarea id="message" rows="4" maxlength="4000" required placeholder="Напишите сообщение в ведомство…"></textarea><button class="btn btn-primary" type="submit">Отправить сообщение</button></form></aside></div>`;document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();try{x.href=await ZB.attachmentUrl(x.dataset.file);x.target='_blank';x.click()}catch(err){alert(err.message)}});document.querySelectorAll('.msg-delete').forEach(b=>b.onclick=async()=>{if(confirm('Удалить это сообщение?')){try{await ZB.deleteOwnMessage(b.dataset.mid);await boot()}catch(e){alert(e.message)}}});document.getElementById('appeal')?.addEventListener('click',async()=>{const r=document.getElementById('appealReason').value.trim();if(!r)return alert('Укажите причину.');try{await ZB.createAppeal(id,r);location.reload()}catch(e){alert(e.message)}});document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,document.getElementById('message').value);await boot()}catch(err){alert(err.message)}finally{b.disabled=false}}}catch(e){document.getElementById('app').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
