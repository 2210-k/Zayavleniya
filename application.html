<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявление — ГосПортал</title><link rel="stylesheet" href="css/main.css?v=20260815-41"><link rel="stylesheet" href="css/admin-application.css?v=20260815-41"><script src="js/supabase-config.js?v=20260815-41"></script><script src="js/supabase.js?v=20260815-41"></script><style>body{background:#080d14}.workspace{max-width:1240px;margin:auto;padding:28px 20px 70px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.hero h1{font-size:32px;letter-spacing:-.04em;margin:8px 0}.hero p{margin:0;color:#7f8c9b;font-size:11px}.hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.date-chip{padding:7px 10px;border:1px solid #2b3743;border-radius:999px;background:#111820;color:#9aa7b5;font-size:10px}.date-chip.game{color:#e4e9ee;border-color:#45525f}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.card{background:linear-gradient(180deg,#151e27,#111820);border:1px solid #293541;border-radius:16px;padding:18px;margin-bottom:14px}.card h2,.card h3{margin:0 0 7px;font-size:14px}.muted{color:#7d8b99;font-size:11px;line-height:1.5}.document{background:#fff;color:#15181c;border-radius:4px;padding:70px 76px;min-height:780px;box-shadow:0 20px 60px #0005;font-family:Georgia,'Times New Roman',serif;line-height:1.8;font-size:15px}.document .to{width:48%;margin-left:auto;margin-bottom:60px;line-height:1.65}.document .title{text-align:center;font-weight:700;font-size:19px;letter-spacing:.02em;margin:30px 0}.document .body{font-size:15px;text-align:justify}.document .meta{margin-top:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;font-family:Arial,sans-serif;font-size:11px}.document .placeholder{color:#777;font-style:italic}.document-error{font-family:Arial,sans-serif;background:#fff8e8;border:1px solid #e6d19d;color:#66521d;padding:18px;border-radius:8px}.timeline{display:grid;gap:9px}.event{padding:11px;border-left:2px solid #3c4b58;background:#0d141b;border-radius:0 9px 9px 0}.event b{display:block;font-size:10px;color:#cfd7de}.event span{display:block;margin-top:4px;font-size:11px}.event small{display:block;margin-top:5px;color:#7e8b98}.chat{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;margin:12px 0}.message{max-width:90%;padding:10px 12px;border-radius:12px;border:1px solid #303b47;background:#0d141b}.message.citizen{align-self:flex-end;background:#1c2731}.message small{display:block;color:#71808e;font-size:9px;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;font-size:11px;line-height:1.5}.message button{border:0;background:none;color:#82909e;cursor:pointer;font-size:9px;float:right}.composer textarea,.appeal textarea{width:100%;box-sizing:border-box;background:#0b1117;color:#edf2f6;border:1px solid #303b47;border-radius:10px;padding:11px;resize:vertical;font:inherit;font-size:11px;outline:none}.composer button{width:100%;margin-top:8px}.info-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #202a34;font-size:10px}.info-row:last-child{border-bottom:0}.attachments{display:grid;gap:7px}.attachment{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid #2b3743;border-radius:10px;background:#0d141b;font-size:10px}.attachment a{color:#e3e9ee}.appeal{margin-top:12px}.appeal .btn{margin-top:8px}.empty{padding:28px;text-align:center;color:#758392;border:1px dashed #34414d;border-radius:11px;font-size:11px}@media(max-width:950px){.layout{grid-template-columns:1fr}.document{padding:40px 35px}.hero{flex-direction:column}}@media(max-width:600px){.workspace{padding:20px 14px 50px}.document{padding:28px 20px;min-height:500px;font-size:13px}.document .to{width:70%;margin-left:auto}.document .meta{grid-template-columns:1fr;margin-top:50px}.hero h1{font-size:26px}}</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Моё заявление</small></span></a><div class="topbar-actions"><button class="btn btn-secondary" onclick="history.back()">← Назад</button><a class="btn btn-secondary" href="applications.html">Мои заявления</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="workspace"><div id="root"><div class="empty">Загрузка заявления…</div></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const statusText={submitted:'Отправлено в ведомство',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const real=v=>v?new Date(v).toLocaleString('ru-RU'):'—';async function boot(){const p=await ZB.requireCitizen();if(!p)return;if(!id){location.href='applications.html';return}logout.onclick=ZB.signOut;try{const [a,h,msgs,atts]=await Promise.all([ZB.getApplication(id),ZB.getHistory(id),ZB.listMessages(id),ZB.listAttachments(id)]);const history=h.length?h.map(x=>`<div class="event"><b>${real(x.real_date||x.created_at)} · игровой день ${esc(x.game_day??'—')}</b><span>${esc(x.action)}</span>${x.comment?`<small>${esc(x.comment)}</small>`:''}</div>`).join(''):'<div class="empty">История пока пуста.</div>';const messages=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===p.id?'citizen':''}"><small>${m.sender_id===p.id?'Вы':'Ведомство'} · ${real(m.created_at)} ${m.sender_id===p.id?`<button data-delete="${m.id}">Удалить</button>`:''}</small><p>${esc(m.message)}</p></div>`).join(''):'<div class="empty">Сообщений пока нет.</div>';const attachments=atts.length?atts.map(x=>`<div class="attachment"><span>📎 ${esc(x.file_name)}</span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<div class="muted">Вложений пока нет.</div>';const canAppeal=['rejected','postponed'].includes(a.status);const doc=a.generated_document&&a.generated_document.trim()?a.generated_document:`<div class="document-error"><b>Документ не был сохранён в этой записи.</b><br>Данные заявления сохранены. Откройте заявление из списка и, если это старое заявление, оно может не иметь сохранённого предварительного документа.</div>`;document.getElementById('root').innerHTML=`<section class="hero"><div><div class="eyebrow">ЗАЯВЛЕНИЕ №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(statusText[a.status]||a.status)}</p><div class="hero-meta"><span class="date-chip">Реальная: ${real(a.real_submitted_at||a.created_at)}</span><span class="date-chip game">Игровая: день ${esc(a.submitted_game_day??'—')}</span></div></div><span class="status status-review">${esc(statusText[a.status]||a.status)}</span></section><div class="layout"><section><article class="document">${doc}</article><div class="card"><h3>Хронология</h3><div class="timeline">${history}</div></div><div class="card"><h3>Вложения</h3><div class="attachments">${attachments}</div></div>${canAppeal?`<div class="card appeal"><h3>Оспорить решение</h3><p class="muted">Оспаривание создаёт отдельное дело и передаёт его ведомству.</p><textarea id="appealReason" rows="5" placeholder="Опишите, почему вы не согласны с решением…"></textarea><button class="btn btn-primary" id="appeal">Подать оспаривание</button></div>`:''}</section><aside><div class="card"><h3>Статус заявления</h3><div class="info-row"><span>Отправлено</span><b>${real(a.real_submitted_at||a.created_at)}</b></div><div class="info-row"><span>Игровой день</span><b>${esc(a.submitted_game_day??'—')}</b></div><div class="info-row"><span>Получено</span><b>${a.real_received_at?real(a.real_received_at)+' · день '+esc(a.received_game_day):'Ожидает'}</b></div><div class="info-row"><span>Рассмотрение</span><b>${a.real_review_started_at?real(a.real_review_started_at)+' · день '+esc(a.review_started_game_day):'Не начато'}</b></div><div class="info-row"><span>Решение</span><b>${a.real_decision_at?real(a.real_decision_at)+' · день '+esc(a.decision_game_day):'Не вынесено'}</b></div>${a.admin_comment?`<p class="muted"><b>Комментарий ведомства:</b><br>${esc(a.admin_comment)}</p>`:''}</div><div class="card"><h3>Переписка с ведомством</h3><div id="chat" class="chat">${messages}</div><form id="composer" class="composer"><textarea id="message" rows="4" maxlength="4000" required placeholder="Напишите сообщение…"></textarea><button class="btn btn-primary" type="submit">Отправить сообщение</button></form></div></aside></div>`;document.querySelectorAll('[data-file]').forEach(el=>el.onclick=async e=>{e.preventDefault();try{el.textContent='Открываем…';window.open(await ZB.attachmentUrl(el.dataset.file),'_blank','noopener')}catch(err){alert(err.message)}});document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=async()=>{if(!confirm('Удалить сообщение?'))return;try{await ZB.deleteOwnMessage(el.dataset.delete);await boot()}catch(err){alert(err.message)}});document.getElementById('composer').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,document.getElementById('message').value);await boot()}catch(err){alert('Не удалось отправить сообщение: '+err.message)}finally{b.disabled=false}};document.getElementById('appeal')?.addEventListener('click',async()=>{const reason=document.getElementById('appealReason').value.trim();if(!reason)return alert('Опишите причину оспаривания.');try{await ZB.createAppeal(id,reason);alert('Оспаривание отправлено в ведомство.');await boot()}catch(err){alert('Не удалось отправить оспаривание: '+err.message)}})}catch(e){document.getElementById('root').innerHTML='<div class="empty">Ошибка: '+esc(e.message)+'</div>'}}boot();</script></body></html>
