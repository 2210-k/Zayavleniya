<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рассмотрение заявления — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-application.css"><script src="js/supabase-config.js?v=20260814-5"></script><script src="js/supabase.js?v=20260814-5"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Рабочее место ведомства</small></span></a><div class="topbar-actions"><span class="admin-badge">АДМИНИСТРАТОР</span><a class="btn btn-secondary" href="admin.html">← Входящие</a></div></header><main class="review-page"><div id="app"><p class="muted">Загрузка заявления…</p></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const appealSt={pending:'Требует внимания',accepted:'Удовлетворено',rejected:'Отклонено',cancelled:'Отменено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function dayPrompt(label){const x=prompt(label+'\n\nИгровой день:','');if(x===null)return null;if(!/^\d+$/.test(x))throw Error('Игровой день должен быть целым числом от 0 и выше.');return Number(x)}async function render(){const a=await ZB.getApplication(id),h=await ZB.getHistory(id),msgs=await ZB.listMessages(id),appeals=await ZB.listAppealsAdmin(),appeal=appeals.find(x=>x.application_id===id&&x.status==='pending')||appeals.find(x=>x.application_id===id);const p=a.profiles||{};document.getElementById('app').innerHTML=`<div class="review-head"><div><div class="eyebrow">ДЕЛО №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(st[a.status]||a.status)} · ${new Date(a.created_at).toLocaleDateString('ru-RU')} · ${esc(a.submitted_game_day??'—')} день</p></div><span class="status ${a.status==='approved'?'status-approved':a.status==='rejected'?'status-danger':'status-review'}">${esc(st[a.status]||a.status)}</span></div><div class="review-grid"><aside><section class="info-card"><h3>Заявитель</h3><b>${esc(p.full_name||'—')}</b><span>Дата рождения: ${esc(p.birth_date||'—')}</span><span>Паспорт: ${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}</span><span>Кем выдан: ${esc(p.passport_issuer||'—')}</span><span>Дата выдачи: ${esc(p.passport_issue_date||'—')}</span><span>Гражданство: ${esc(p.citizenship||'—')}</span><span>Место рождения: ${esc(p.birth_place||'—')}</span><span>Национальность: ${esc(p.nationality||'—')}</span><span>Проживание: ${esc(p.residence_address||'—')}</span><span>Регистрация: ${esc(p.registration_address||'—')}</span></section><section class="info-card"><h3>Хронология</h3><div class="timeline">${h.map(x=>`<span><b>${new Date(x.real_date||x.created_at).toLocaleDateString('ru-RU')} · ${esc(x.game_day??'—')} день</b>${esc(x.action)}${x.comment?'<small>'+esc(x.comment)+'</small>':''}</span>`).join('')||'<span>История пуста.</span>'}</div></section></aside><section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article>${appeal?`<section class="appeal-card ${appeal.status==='pending'?'pending':''}"><h3>⚖ Оспаривание решения · ${esc(appealSt[appeal.status]||appeal.status)}</h3><p class="muted">Заявитель: ${esc(appeal.citizen_name||'—')} · подано ${new Date(appeal.created_at).toLocaleString('ru-RU')}</p><div class="appeal-reason">${esc(appeal.reason)}</div>${appeal.status==='pending'?`<div class="appeal-actions"><button id="appealAccept" class="btn btn-primary">Удовлетворить</button><button id="appealReject" class="btn btn-danger">Отклонить</button><button id="appealCancel" class="btn btn-secondary">Отменить</button></div>`:'<p class="muted" style="margin:12px 0 0">Комментарий: '+esc(appeal.admin_comment||'—')+'</p>'}</section>`:''}<section class="actions"><h3>Решение по заявлению</h3><p class="muted">Реальная дата фиксируется автоматически. Игровой день вводится непосредственно перед действием.</p><div class="action-grid">${a.status==='submitted'?'<button id="receive" class="btn btn-primary">Получить заявление</button>':''}${['submitted','received'].includes(a.status)?'<button id="review" class="btn btn-secondary">Начать рассмотрение</button>':''}${['reviewing','received'].includes(a.status)?'<button data-s="approved" class="decision btn btn-primary">✓ Одобрить</button><button data-s="rejected" class="decision btn btn-danger">✕ Отказать</button><button data-s="postponed" class="decision btn btn-warning">Ⅱ Отложить</button><button data-s="cancelled" class="decision btn btn-secondary">Отменить</button>':''}</div></section><section class="danger-zone"><h3>Обслуживание данных</h3><p class="muted">Только для администратора. Эти действия могут быть необратимыми.</p><div class="action-grid"><button id="clearMessages" class="btn btn-secondary">Очистить сообщения</button><button id="clearHistory" class="btn btn-secondary">Очистить историю</button><button id="deleteApp" class="btn btn-danger">Удалить заявление</button></div></section></section><aside class="message-panel"><h3>💬 Переписка с гражданином</h3><div id="chat" class="chat">${msgs.length?msgs.map(m=>`<div class="message admin"><small>${esc(m.sender_id===ZB.currentUser?'Ведомство':'Гражданин')} · ${new Date(m.created_at).toLocaleString('ru-RU')} · ${esc(m.game_day??'—')} день</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Сообщений пока нет.</p>'}</div><form id="messageForm" class="message-form"><textarea id="message" rows="4" maxlength="4000" required placeholder="Напишите гражданину официальное сообщение…"></textarea><div class="compose-meta"><input id="gameDay" type="number" min="0" step="1" required placeholder="Игровой день"><button class="btn btn-primary" type="submit">Отправить</button></div></form></aside></div>`;bind(a,appeal)}async function bind(a,appeal){document.getElementById('receive')?.addEventListener('click',async()=>{try{const d=dayPrompt('Получение заявления');if(d===null)return;await ZB.adminReceive(id,d);await render()}catch(e){alert(e.message)}});document.getElementById('review')?.addEventListener('click',async()=>{try{const d=dayPrompt('Начало рассмотрения');if(d===null)return;await ZB.adminStartReview(id,d);await render()}catch(e){alert(e.message)}});document.querySelectorAll('.decision').forEach(b=>b.onclick=async()=>{try{const d=dayPrompt('Решение: '+st[b.dataset.s]);if(d===null)return;const c=prompt('Комментарий администратора:','')||'';await ZB.adminDecision(id,b.dataset.s,c,d);await render()}catch(e){alert(e.message)}});document.getElementById('appealAccept')?.addEventListener('click',()=>resolveAppeal('accepted'));document.getElementById('appealReject')?.addEventListener('click',()=>resolveAppeal('rejected'));document.getElementById('appealCancel')?.addEventListener('click',()=>resolveAppeal('cancelled'));async function resolveAppeal(status){try{const d=dayPrompt('Решение по оспариванию');if(d===null)return;const c=prompt('Комментарий по оспариванию:','')||'';await ZB.resolveAppealAdmin(appeal.id,status,c,d);await render()}catch(e){alert(e.message)}}document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,document.getElementById('message').value.trim(),document.getElementById('gameDay').value);await render()}catch(err){alert(err.message)}finally{b.disabled=false}};document.getElementById('clearMessages').onclick=async()=>{if(confirm('Очистить все сообщения по этому делу?')){await ZB.clearMessages(id);await render()}};document.getElementById('clearHistory').onclick=async()=>{if(confirm('Удалить всю историю действий этого дела?')){await ZB.clearHistory(id);await render()}};document.getElementById('deleteApp').onclick=async()=>{if(confirm('Удалить заявление НАВСЕГДА?')){await ZB.deleteApplication(id);location.href='admin.html'}}}async function boot(){const p=await ZB.requireAdmin();if(!p)return;if(!id){location.href='admin.html';return}try{await render()}catch(e){document.getElementById('app').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
