<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело — ГосПортал</title><link rel="stylesheet" href="redesign-v2/css/admin-v2.css?v=20260821-2"><script src="js/supabase-config.js?v=20260821-2"></script><script src="js/supabase.js?v=20260821-2"></script><style>.case{max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:14px}.panel{background:linear-gradient(180deg,#151e27,#10171f);border:1px solid #293642;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 12px 35px #0002}.panel h3{margin:0 0 12px;font-size:13px}.kv{padding:9px 0;border-bottom:1px solid #202b35;font-size:10px;line-height:1.5}.kv b{display:block;color:#687787;font-size:8px;letter-spacing:.08em;margin-bottom:3px}.doc{background:#fff;color:#171a1e;padding:70px 72px;min-height:760px;font:15px/1.8 Georgia,'Times New Roman',serif;box-shadow:0 20px 70px #0006;overflow:auto}.timeline,.chat,.files{display:grid;gap:8px}.event{padding:10px 11px;border-left:2px solid #42515e;background:#0c131a;border-radius:0 9px 9px 0;font-size:9px}.event b{display:block;color:#d9e1e7}.event small{display:block;color:#758392;margin-top:4px}.field{display:grid;gap:6px;margin:9px 0}.field label{font-size:8px;color:#8795a4;font-weight:800}.field input,.field textarea{box-sizing:border-box;width:100%;background:#0a1117;color:#edf2f6;border:1px solid #2b3844;border-radius:9px;padding:10px;font:inherit;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.appeal-box{border:1px solid #6b4f24;background:#211a0e;border-radius:13px;padding:14px;margin-bottom:14px}.appeal-box.pending{border-color:#8a6828}.appeal-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.appeal-reason{margin:10px 0;color:#d9c9a6;font-size:11px;line-height:1.6;white-space:pre-wrap}.msg{position:relative;padding:10px 34px 10px 11px;border:1px solid #283540;border-radius:11px;background:#0a1117;font-size:10px}.msg.me{background:#17232d}.msg small{display:block;color:#6f7e8c;font-size:8px;margin-bottom:4px}.msg p{margin:0;white-space:pre-wrap;line-height:1.5}.msg-del{position:absolute;right:7px;top:7px;border:0;background:transparent;color:#71808d;cursor:pointer}.file{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #202b35;font-size:9px}.file a{color:#dce4ea}.quick{display:flex;gap:5px;flex-wrap:wrap}.quick button{font-size:8px;padding:6px 8px;border:1px solid #30404d;background:#111a22;color:#aeb9c4;border-radius:7px;cursor:pointer}.danger{border-color:#56323b}@media(max-width:1100px){.grid{grid-template-columns:230px minmax(0,1fr)}.right{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}.doc{padding:30px 22px;min-height:500px}}
</style></head><body><div class="v2-shell"><header class="v2-top"><a class="v2-brand" href="admin.html"><span class="v2-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Карточка дела</small></span></a><div class="v2-actions"><a class="v2-btn" href="admin-applications.html">← Заявления</a><a class="v2-btn" href="admin.html">Обзор</a></div></header><div class="v2-layout"><aside class="v2-side"><div class="v2-side-label">РАБОТА</div><nav class="v2-nav"><a href="admin.html">Обзор</a><a class="active" href="admin-applications.html">Заявления</a><a href="admin-appeals.html">Оспаривания</a><a href="admin-citizens.html">Граждане</a><a href="admin-messages.html">Сообщения</a><a href="admin-service.html">Обслуживание</a></nav></aside><main class="v2-main"><div class="case" id="app"><div class="v2-empty">Загрузка дела…</div></div></main></div></div><script>const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),dt=x=>x?new Date(x).toLocaleString('ru-RU'):'—';const status={submitted:'Ожидает получения',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отказано',postponed:'Отложено',cancelled:'Отменено',appealed:'ОСПАРИВАНИЕ — требуется решение'};async function load(){if(!await ZB.requireAdmin())return;if(!id)throw Error('Не указан id заявления');const [a,h,msgs,files,appeals]=await Promise.all([ZB.getApplicationAdmin(id),ZB.getHistory(id),ZB.listMessages(id),ZB.listAttachments(id),ZB.listApplicationAppeals(id)]);const p=a.profiles||{},pending=appeals.find(x=>x.status==='pending');$('app').innerHTML=`<div class="v2-kicker">ДЕЛО №${String(a.application_number||'').padStart(6,'0')}</div><h1 class="v2-title">${esc(a.title||'Заявление')}</h1><p class="v2-sub">${esc(status[a.status]||a.status)} · отправлено ${dt(a.real_submitted_at||a.created_at)} · игровой день ${esc(a.submitted_game_day??'—')}</p>${pending?`<section class="appeal-box pending"><div class="appeal-title"><b>⚖ ВЕТКА ОСПАРИВАНИЯ</b><span class="v2-sub">Ожидает решения</span></div><div class="appeal-reason">${esc(pending.reason)}</div><div class="field"><label>ИГРОВОЙ ДЕНЬ РЕШЕНИЯ</label><input id="appealDay" type="number" min="0" placeholder="Игровой день"></div><div class="field"><label>КОММЕНТАРИЙ</label><textarea id="appealComment" rows="3" placeholder="Обоснование решения по оспариванию"></textarea></div><div class="actions"><button class="v2-btn good" data-appeal="accepted">Удовлетворить — вернуть на рассмотрение</button><button class="v2-btn bad" data-appeal="rejected">Отклонить оспаривание</button><button class="v2-btn warn" data-appeal="cancelled">Отменить оспаривание</button></div></section>`:''}<div class="grid"><aside><section class="panel"><h3>Заявитель</h3><b>${esc(p.full_name||'—')}</b><div class="kv"><b>ДАТА РОЖДЕНИЯ</b>${esc(p.birth_date||'—')}</div><div class="kv"><b>ПАСПОРТ</b>${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}</div><div class="kv"><b>ВЫДАН</b>${esc(p.passport_issuer||'—')} · ${esc(p.passport_issue_date||'—')}</div><div class="kv"><b>ГРАЖДАНСТВО</b>${esc(p.citizenship||'—')}</div><div class="kv"><b>МЕСТО РОЖДЕНИЯ</b>${esc(p.birth_place||'—')}</div><div class="kv"><b>НАЦИОНАЛЬНОСТЬ</b>${esc(p.nationality||'—')}</div><div class="kv"><b>ПРОЖИВАНИЕ</b>${esc(p.residence_address||'—')}</div><div class="kv"><b>РЕГИСТРАЦИЯ</b>${esc(p.registration_address||'—')}</div></section><section class="panel"><h3>Хронология</h3><div class="timeline">${h.length?h.map(x=>`<div class="event"><b>${dt(x.real_date||x.created_at)} · игровой день ${esc(x.game_day??'—')}</b>${esc(x.action)}${x.comment?`<small>${esc(x.comment)}</small>`:''}</div>`).join(''):'<span class="v2-sub">История пуста.</span>'}</div></section></aside><section><article class="doc">${a.generated_document||'<p>Сформированный документ отсутствует.</p>'}</article><section class="panel"><h3>Управление заявлением</h3><div class="field"><label>ИГРОВОЙ ДЕНЬ</label><input id="day" type="number" min="0" placeholder="Например, 250"></div><div class="field"><label>КОММЕНТАРИЙ К ДЕЙСТВИЮ</label><textarea id="comment" rows="3" placeholder="Причина или пояснение"></textarea></div><div class="actions">${a.status==='submitted'?'<button class="v2-btn primary" data-act="receive">✓ Получить ведомством</button>':''}${a.status==='received'?'<button class="v2-btn warn" data-act="review">▶ Начать рассмотрение</button>':''}${a.status==='reviewing'?'<button class="v2-btn good" data-act="approved">✓ Одобрить заявление</button><button class="v2-btn bad" data-act="rejected">✕ Отказать</button><button class="v2-btn warn" data-act="postponed">⏸ Отложить</button><button class="v2-btn bad" data-act="cancelled">⊘ Отменить</button>':''}</div><div class="quick" style="margin-top:9px"><button data-msg="Пожалуйста, предоставьте недостающие документы.">Запросить документы</button><button data-msg="Ведомство продолжает рассмотрение вашего заявления.">Сообщить о рассмотрении</button><button data-msg="Пожалуйста, уточните информацию по заявлению.">Запросить уточнение</button></div></section><section class="panel"><h3>Приложения</h3><div class="files">${files.length?files.map(x=>`<div class="file"><span>📎 ${esc(x.file_name)} ${x.file_size?`<small>(${Math.ceil(x.file_size/1024)} КБ)</small>`:''}</span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<span class="v2-sub">Приложений пока нет.</span>'}</div></section></section><aside class="right"><section class="panel"><h3>Переписка с гражданином</h3><div class="chat">${msgs.length?msgs.map(m=>`<div class="msg ${m.sender_id===a.citizen_id?'':'me'}"><button class="msg-del" data-delete="${m.id}" title="Удалить">×</button><small>${m.sender_id===a.citizen_id?'Гражданин':'Ведомство'} · ${dt(m.created_at)}</small><p>${esc(m.message)}</p></div>`).join(''):'<span class="v2-sub">Сообщений нет.</span>'}</div><form id="send"><div class="field"><textarea id="text" rows="3" maxlength="4000" placeholder="Сообщение гражданину"></textarea></div><button class="v2-btn primary" style="width:100%">Отправить сообщение</button></form></section><section class="panel danger"><h3>Обслуживание</h3><div class="actions"><button class="v2-btn" id="clearMessages">Очистить переписку</button><button class="v2-btn" id="delete">Удалить дело</button></div></section></aside></div>`;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{try{const d=Number($('day').value),c=$('comment').value.trim();if(!Number.isInteger(d)||d<0)throw Error('Укажите игровой день.');if(b.dataset.act==='receive')await ZB.adminReceive(id,d);else if(b.dataset.act==='review')await ZB.adminStartReview(id,d);else await ZB.decideApplication(id,b.dataset.act,d,c);await load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-appeal]').forEach(b=>b.onclick=async()=>{try{const d=Number($('appealDay').value),c=$('appealComment').value.trim();if(!Number.isInteger(d)||d<0)throw Error('Укажите игровой день решения.');if(!pending)throw Error('Оспаривание уже закрыто.');await ZB.resolveAppealAdmin(pending.id,b.dataset.appeal,c,d);await load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();try{window.open(await ZB.attachmentUrl(x.dataset.file),'_blank','noopener')}catch(z){alert(z.message)}});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=async()=>{if(!confirm('Удалить это сообщение?'))return;try{await ZB.deleteMessage(x.dataset.delete);await load()}catch(e){alert(e.message)}});$('send').onsubmit=async e=>{e.preventDefault();const t=$('text').value.trim();if(!t)return;try{await ZB.sendMessage(id,t);await load()}catch(x){alert(x.message)}};document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{$('text').value=b.dataset.msg;$('text').focus()});$('clearMessages').onclick=async()=>{if(confirm('Удалить всю переписку по делу?')){await ZB.clearMessages(id);await load()}};$('delete').onclick=async()=>{if(confirm('Удалить заявление полностью?')){await ZB.deleteApplication(id);location.href='admin-applications.html'}}}load().catch(e=>{$('app').innerHTML='<div class="v2-empty">Ошибка: '+esc(e.message)+'</div>'});</script></body></html>
