<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело — Ведомство</title><style>body{margin:0;background:#f4f6f8;color:#18202a;font-family:Inter,system-ui,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.page{max-width:1450px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;margin-bottom:18px}.grid{display:grid;grid-template-columns:270px minmax(400px,1fr) 350px;gap:16px}.card,.doc{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:17px;box-shadow:0 8px 28px #0000000a;margin-bottom:16px}.doc{padding:45px;min-height:600px;font:15px/1.8 Georgia,serif}.doc h1,.doc h2{text-align:center}.btn{border:1px solid #dfe3e8;background:#fff;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:#202a35;color:#fff}.danger{color:#a43b3b}.ok{color:#28734b}.warn{color:#98691a}.muted{color:#6b7280;font-size:11px}.kv{padding:7px 0;border-bottom:1px solid #f0f1f3;font-size:11px}.kv b{display:block;font-size:9px;color:#6b7280;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap}.chat{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto}.msg{max-width:88%;padding:10px 12px;border:1px solid #e2e5e8;border-radius:13px;background:#f4f5f6;font-size:12px}.citizen{align-self:flex-start}.admin{align-self:flex-end;background:#202a35;color:#fff}.msg small{display:block;opacity:.6;font-size:9px;margin-bottom:4px}.msg p{margin:0;white-space:pre-wrap}.msg button{border:0;background:none;color:inherit;font-size:9px;cursor:pointer;margin-top:5px}.field{margin:8px 0}.field label{display:block;font-size:9px;font-weight:800;color:#6b7280;margin-bottom:5px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #dfe3e8;border-radius:10px;padding:10px;font:inherit;font-size:12px}textarea{min-height:80px}.file{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:11px}.appeal{background:#fffaf0;border-color:#ead9b8}@media(max-width:1100px){.grid{grid-template-columns:230px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.page{padding:12px}.grid{grid-template-columns:1fr}.doc{padding:24px}.head{display:block}}</style></head><body><header class="top"><b>ВЕДОМСТВО <small style="color:#6b7280;font-weight:500">Рабочее место администратора</small></b><div class="actions"><button class="btn" onclick="location.href='admin-applications.html'">← Заявления</button><button class="btn" onclick="location.href='admin.html'">Обзор</button></div></header><main class="page"><div id="app"><div class="card">Загрузка дела…</div></div></main><script src="js/supabase-config.js?v=20260815-70"></script><script src="js/supabase.js?v=20260815-70"></script><script>
const id=new URLSearchParams(location.search).get('id'),E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),D=s=>s?new Date(s).toLocaleString('ru-RU'):'—',S={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено'};
async function load(){if(!id)throw Error('Не указан id заявления');const a=await ZB.getApplication(id);if(!a)throw Error('Заявление не найдено');const me=await ZB.currentUser(),p=a.profiles||{},h=await ZB.getHistory(id),ms=await ZB.listMessages(id),at=await ZB.listAttachments(id),aps=await ZB.listAppealsAdmin(),ap=aps.find(x=>String(x.application_id)===String(id));const chat=ms.length?ms.map(m=>'<div class="msg '+(m.sender_id===me.id?'admin':'citizen')+'"><small>'+(m.sender_id===me.id?'ВЕДОМСТВО':'ГРАЖДАНИН')+' · '+D(m.created_at)+'</small><p>'+E(m.message)+'</p>'+(m.sender_id===me.id?'<button data-del="'+E(m.id)+'">Удалить</button>':'')+'</div>').join(''):'<p class="muted">Переписка пуста.</p>',files=at.length?at.map(f=>'<div class="file">📎 '+E(f.file_name)+' <a href="#" data-file="'+E(f.file_path)+'">Открыть</a></div>').join(''):'<span class="muted">Вложений нет.</span>',timeline=h.map(x=>'<div class="kv"><b>'+D(x.real_date||x.created_at)+' · '+E(x.game_day??'—')+' день</b>'+E(x.action)+(x.comment?'<br>'+E(x.comment):'')+'</div>').join('')||'<span class="muted">История пуста.</span>';let decision='';if(['received','reviewing'].includes(a.status))decision='<section class="card"><h3>Решение</h3><div class="field"><label>ИГРОВОЙ ДЕНЬ</label><input id="day" type="number" min="0" placeholder="Например: 27"></div><div class="field"><label>КОММЕНТАРИЙ</label><textarea id="comment" placeholder="Основание решения"></textarea></div><div class="actions"><button class="btn ok" data-dec="approved">Одобрить</button><button class="btn danger" data-dec="rejected">Отказать</button><button class="btn warn" data-dec="postponed">Отложить</button><button class="btn" data-dec="cancelled">Отменить</button></div></section>';let appeal='';if(ap)appeal='<section class="card appeal"><h3>⚖ Оспаривание</h3><p>'+E(ap.reason||'Причина не указана')+'</p><p class="muted">Статус: '+E(ap.status)+'</p>'+(ap.status==='pending'?'<div class="field"><label>ИГРОВОЙ ДЕНЬ</label><input id="ad" type="number" min="0" placeholder="Например: 30"></div><div class="field"><label>КОММЕНТАРИЙ</label><textarea id="ac" placeholder="Решение администрации"></textarea></div><div class="actions"><button class="btn primary" id="aa">Удовлетворить</button><button class="btn danger" id="ar">Отклонить</button><button class="btn" id="ax">Отменить</button></div>':'');document.getElementById('app').innerHTML='<div class="head"><div><div class="muted">ДЕЛО №'+E(String(a.application_number).padStart(6,'0'))+'</div><h1>'+E(a.title)+'</h1><span class="muted">'+E(S[a.status]||a.status)+' · '+D(a.created_at)+' · игровой день '+E(a.submitted_game_day??'—')+'</span></div><button class="btn" onclick="location.href=\'admin-applications.html\'">← К заявлениям</button></div><div class="grid"><aside><section class="card"><h3>Заявитель</h3><b>'+E(p.full_name||'—')+'</b><div class="kv"><b>Дата рождения</b>'+E(p.birth_date||'—')+'</div><div class="kv"><b>Паспорт</b>'+E(p.passport_series||'—')+' '+E(p.passport_number||'—')+'</div><div class="kv"><b>Кем выдан</b>'+E(p.passport_issuer||'—')+'</div><div class="kv"><b>Дата выдачи</b>'+E(p.passport_issue_date||'—')+'</div><div class="kv"><b>Гражданство</b>'+E(p.citizenship||'—')+'</div><div class="kv"><b>Место рождения</b>'+E(p.birth_place||'—')+'</div><div class="kv"><b>Национальность</b>'+E(p.nationality||'—')+'</div><div class="kv"><b>Проживание</b>'+E(p.residence_address||'—')+'</div><div class="kv"><b>Регистрация</b>'+E(p.registration_address||'—')+'</div></section><section class="card"><h3>Хронология</h3>'+timeline+'</section></aside><section><article class="doc">'+(a.generated_document||'<p>Документ отсутствует.</p>')+'</article><section class="card"><h3>Вложения</h3>'+files+'<input id="file" type="file"><button class="btn" id="upload">Прикрепить к делу</button></section>'+appeal+decision+'<section class="card"><h3>Формы по делу</h3><p class="muted">Открытие формы передаёт application_id этого дела.</p><button class="btn" id="form">Создать форму для этого дела</button></section><section class="card"><h3>Обслуживание</h3><div class="actions"><button class="btn" id="clear">Очистить историю</button><button class="btn danger" id="delapp">Удалить заявление</button></div></section></section><aside class="right"><section class="card"><h3>Переписка</h3><p class="muted">Игровая дата здесь не указывается.</p><div class="chat">'+chat+'</div><form id="send"><textarea id="text" required placeholder="Сообщение гражданину…"></textarea><button class="btn primary" style="width:100%">Отправить</button></form></section></aside></div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить сообщение?')){await ZB.deleteMessage(b.dataset.del);load()}});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{const d=Number(document.getElementById('day').value),c=document.getElementById('comment').value.trim();if(!Number.isFinite(d)||!c)return alert('Заполните игровой день и комментарий');await ZB.decideApplication(id,b.dataset.dec,d,c);load()});document.getElementById('send').onsubmit=async e=>{e.preventDefault();await ZB.sendMessage(id,document.getElementById('text').value.trim());load()};document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return alert('Выберите файл');await ZB.uploadAttachment(id,f);load()};document.getElementById('clear').onclick=async()=>{if(confirm('Очистить историю?')){await ZB.clearHistory(id);load()}};document.getElementById('delapp').onclick=async()=>{if(confirm('Удалить заявление полностью?')){await ZB.deleteApplication(id);location.href='admin-applications.html'}};document.getElementById('form').onclick=()=>location.href='admin-forms.html?application_id='+encodeURIComponent(id)+'&citizen_id='+encodeURIComponent(a.user_id||a.citizen_id||'');document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();try{window.open(await ZB.attachmentUrl(x.dataset.file),'_blank')}catch(err){alert(err.message)}});if(ap&&ap.status==='pending')for(const [el,status] of [['aa','accepted'],['ar','rejected'],['ax','cancelled']])document.getElementById(el).onclick=async()=>{const d=Number(document.getElementById('ad').value),c=document.getElementById('ac').value.trim();if(!Number.isFinite(d)||!c)return alert('Заполните игровой день и комментарий');await ZB.resolveAppealAdmin(ap.id,status,d,c);load()}}
load().catch(e=>document.getElementById('app').innerHTML='<section class="card"><h3>Не удалось открыть заявление</h3><p class="muted">'+E(e.message)+'</p><button class="btn primary" onclick="location.href=\'admin-applications.html\'">Вернуться к заявлениям</button></section>');</script></body></html>
