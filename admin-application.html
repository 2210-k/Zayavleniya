<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело — Администрация</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin-application.css"><script src="js/supabase-config.js?v=20260815-30"></script><script src="js/supabase.js?v=20260815-30"></script><style>.message-panel{position:sticky;top:18px;background:#0d1522;border:1px solid #2c3744;border-radius:18px;padding:16px}.chat{display:flex;flex-direction:column;gap:9px;max-height:480px;overflow:auto;padding:5px}.message{max-width:88%;padding:11px 13px;border-radius:14px;position:relative}.message.citizen{align-self:flex-start;background:#1b2633;border:1px solid #344354;color:#edf2f6}.message.admin{align-self:flex-end;background:#dfe4e8;color:#111820;border:1px solid #f2f4f6}.message small{display:flex;justify-content:space-between;gap:8px;font-size:9px;opacity:.7;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.5}.msg-delete{border:0;background:transparent;cursor:pointer;font-size:10px;color:inherit;opacity:.6}.attachments{margin-top:14px;padding:16px;border:1px solid #2b3642;border-radius:16px;background:#101820}.attachment-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #26313c;font-size:12px}.attachment-row:last-child{border-bottom:0}.attachment-row a{color:#dfe5eb}.message-form textarea{width:100%;box-sizing:border-box;background:#0a1119;color:#fff;border:1px solid #303b47;border-radius:12px;padding:12px;resize:vertical}.message-form button{width:100%;margin-top:8px}@media(max-width:1000px){.message-panel{position:static}}@media(max-width:650px){.message{max-width:94%}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Рабочее место ведомства</small></span></a><div class="topbar-actions"><span class="admin-badge">АДМИНИСТРАТОР</span><a class="btn btn-secondary" href="admin-applications.html">← Заявления</a></div></header><main class="review-page"><div id="app"><p class="muted">Загрузка…</p></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const appealSt={pending:'Требует внимания',accepted:'Удовлетворено',rejected:'Отклонено',cancelled:'Отменено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dayPrompt=l=>{const x=prompt(l+'\n\nИгровой день:','');if(x===null)return null;if(!/^\d+$/.test(x))throw Error('Введите целый игровой день от 0.');return Number(x)};async function render(){const me=await ZB.currentUser(),a=await ZB.getApplication(id),h=await ZB.getHistory(id),msgs=await ZB.listMessages(id),atts=await ZB.listAttachments(id),appeal=(await ZB.listAppealsAdmin()).find(x=>x.application_id===id);const p=a.profiles||{};let attHtml=atts.length?atts.map(x=>`<div class="attachment-row"><span>📎 ${esc(x.file_name)}</span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<span class="muted">Прикреплённых файлов нет.</span>';document.getElementById('app').innerHTML=`<div class="review-head"><div><div class="eyebrow">ДЕЛО №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(st[a.status]||a.status)} · ${new Date(a.created_at).toLocaleDateString('ru-RU')} · ${esc(a.submitted_game_day??'—')} день</p></div><span class="status status-review">${esc(st[a.status]||a.status)}</span></div><div class="review-grid"><aside><section class="info-card"><h3>Заявитель</h3><b>${esc(p.full_name||'—')}</b><span>Дата рождения: ${esc(p.birth_date||'—')}</span><span>Паспорт: ${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}</span><span>Кем выдан: ${esc(p.passport_issuer||'—')}</span><span>Дата выдачи: ${esc(p.passport_issue_date||'—')}</span><span>Гражданство: ${esc(p.citizenship||'—')}</span><span>Место рождения: ${esc(p.birth_place||'—')}</span><span>Национальность: ${esc(p.nationality||'—')}</span><span>Проживание: ${esc(p.residence_address||'—')}</span><span>Регистрация: ${esc(p.registration_address||'—')}</span></section><section class="info-card"><h3>Хронология</h3><div class="timeline">${h.map(x=>`<span><b>${new Date(x.real_date||x.created_at).toLocaleDateString('ru-RU')} · ${esc(x.game_day??'—')} день</b>${esc(x.action)}${x.comment?'<small>'+esc(x.comment)+'</small>':''}</span>`).join('')||'<span>История пуста.</span>'}</div></section></aside><section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article>${appeal?`<section class="appeal-card"><h3>⚖ Оспаривание · ${esc(appealSt[appeal.status]||appeal.status)}</h3><p class="muted">${esc(appeal.citizen_name||'Гражданин')}</p><div class="appeal-reason">${esc(appeal.reason)}</div>${appeal.status==='pending'?'<div class="appeal-actions"><button id="appealAccept" class="btn btn-primary">Удовлетворить</button><button id="appealReject" class="btn btn-danger">Отклонить</button><button id="appealCancel" class="btn btn-secondary">Отменить</button></div>':'<p class="muted">Комментарий: '+esc(appeal.admin_comment||'—')+'</p>'}</section>`:''}<section class="actions"><h3>Действия по делу</h3><div class="action-grid">${a.status==='submitted'?'<button id="receive" class="btn btn-primary">Получить</button>':''}${['submitted','received'].includes(a.status)?'<button id="review" class="btn btn-secondary">Начать рассмотрение</button>':''}${['reviewing','received'].includes(a.status)?'<button data-s="approved" class="decision btn btn-primary">Одобрить</button><button data-s="rejected" class="decision btn btn-danger">Отказать</button><button data-s="postponed" class="decision btn btn-warning">Отложить</button><button data-s="cancelled" class="decision btn btn-secondary">Отменить</button>':''}</div></section><section class="attachments"><h3>📎 Вложения к делу</h3><div>${attHtml}</div><input id="file" type="file" style="margin-top:12px;width:100%"><button id="upload" class="btn btn-secondary" style="margin-top:8px">Прикрепить файл</button></section><section class="danger-zone"><h3>Обслуживание</h3><div class="action-grid"><button id="clearMessages" class="btn btn-secondary">Очистить сообщения</button><button id="clearHistory" class="btn btn-secondary">Очистить историю</button><button id="deleteApp" class="btn btn-danger">Удалить заявление</button></div></section></section><aside class="message-panel"><h3>Переписка</h3><p class="muted">Дата сообщения ставится автоматически. Сообщения ведомства и гражданина различаются.</p><div id="chat" class="chat">${msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===me.id?'admin':'citizen'}"><small><span>${esc(m.sender_id===me.id?'ВЕДОМСТВО':'ГРАЖДАНИН')} · ${new Date(m.created_at).toLocaleString('ru-RU')}</span>${m.sender_id===me.id?`<button class="msg-delete" data-mid="${m.id}" title="Удалить сообщение">Удалить</button>`:''}</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Сообщений пока нет.</p>'}</div><form id="messageForm" class="message-form"><textarea id="message" rows="4" maxlength="4000" required placeholder="Напишите гражданину…"></textarea><button class="btn btn-primary" type="submit">Отправить сообщение</button></form></aside></div>`;document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();x.textContent='Открываем…';try{x.href=await ZB.attachmentUrl(x.dataset.file);x.target='_blank';x.click()}catch(err){alert(err.message)}});document.getElementById('upload').onclick=async()=>{try{const f=document.getElementById('file').files[0];await ZB.uploadAttachment(id,f);await render()}catch(e){alert('Не удалось прикрепить файл: '+e.message)}};bind(appeal)}async function bind(appeal){document.getElementById('receive')?.addEventListener('click',async()=>{try{const d=dayPrompt('Получение заявления');if(d!==null){await ZB.adminReceive(id,d);await render()}}catch(e){alert(e.message)}});document.getElementById('review')?.addEventListener('click',async()=>{try{const d=dayPrompt('Начало рассмотрения');if(d!==null){await ZB.adminStartReview(id,d);await render()}}catch(e){alert(e.message)}});document.querySelectorAll('.decision').forEach(b=>b.onclick=async()=>{try{const d=dayPrompt('Решение: '+st[b.dataset.s]);if(d!==null){await ZB.adminDecision(id,b.dataset.s,prompt('Комментарий:','')||'',d);await render()}}catch(e){alert(e.message)}});async function resolve(status){try{const d=dayPrompt('Решение по оспариванию');if(d!==null){await ZB.resolveAppealAdmin(appeal.id,status,prompt('Комментарий:','')||'',d);await render()}}catch(e){alert(e.message)}}document.getElementById('appealAccept')?.addEventListener('click',()=>resolve('accepted'));document.getElementById('appealReject')?.addEventListener('click',()=>resolve('rejected'));document.getElementById('appealCancel')?.addEventListener('click',()=>resolve('cancelled'));document.querySelectorAll('.msg-delete').forEach(b=>b.onclick=async()=>{if(confirm('Удалить это сообщение?')){try{await ZB.deleteMessage(b.dataset.mid);await render()}catch(e){alert(e.message)}}});document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,document.getElementById('message').value);await render()}catch(err){alert(err.message)}finally{b.disabled=false}};document.getElementById('clearMessages').onclick=async()=>{if(confirm('Очистить все сообщения по делу?')){await ZB.clearMessages(id);await render()}};document.getElementById('clearHistory').onclick=async()=>{if(confirm('Удалить историю действий?')){await ZB.clearHistory(id);await render()}};document.getElementById('deleteApp').onclick=async()=>{if(confirm('Удалить заявление НАВСЕГДА?')){await ZB.deleteApplication(id);location.href='admin-applications.html'}}}async function boot(){if(!await ZB.requireAdmin())return;if(!id){location.href='admin-applications.html';return}try{await render()}catch(e){document.getElementById('app').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
