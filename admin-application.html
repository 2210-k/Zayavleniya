<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рассмотрение заявления — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-application.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Рассмотрение заявления</small></span></a><a class="btn btn-secondary" href="admin.html">← Входящие</a></header><main class="review-page"><div id="app"><p class="muted">Загрузка…</p></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function gamePrompt(label){const x=prompt(label+'\n\nВведите игровой день:', '');if(x===null)return null;if(!/^\d+$/.test(x))throw Error('Игровой день должен быть целым числом.');return Number(x)}async function boot(){const p=await ZB.requireAdmin();if(!p)return;if(!id){location.href='admin.html';return}try{const a=await ZB.getApplication(id),h=await ZB.getHistory(id);document.getElementById('app').innerHTML=`<div class="review-head"><div><div class="eyebrow">ЗАЯВЛЕНИЕ №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(st[a.status]||a.status)} · ${new Date(a.created_at).toLocaleDateString('ru-RU')} (${esc(a.submitted_game_day??'—')} день)</p></div><span class="status status-review">${esc(st[a.status]||a.status)}</span></div><div class="review-grid"><aside><section class="info-card"><h3>Заявитель</h3><b>${esc(a.profiles?.full_name||'—')}</b><span>Дата рождения: ${esc(a.profiles?.birth_date||'—')}</span><span>Паспорт: ${esc(a.profiles?.passport_series||'')} ${esc(a.profiles?.passport_number||'')}</span><span>Адрес: ${esc(a.profiles?.residence_address||'—')}</span></section><section class="info-card"><h3>История</h3><div class="timeline">${h.map(x=>`<span><b>${new Date(x.real_date).toLocaleDateString('ru-RU')} (${esc(x.game_day??'—')} день)</b>${esc(x.action)}${x.comment?'<small>'+esc(x.comment)+'</small>':''}</span>`).join('')}</div></section></aside><section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article><section class="actions"><h3>Действия</h3><p class="muted">При каждом действии игровой день вводится отдельно.</p><div class="action-grid">${a.status==='submitted'?'<button id="receive" class="btn btn-primary">Получить заявление</button>':''}${['submitted','received'].includes(a.status)?'<button id="review" class="btn btn-secondary">Начать рассмотрение</button>':''}${['reviewing','received'].includes(a.status)?'<button data-s="approved" class="decision btn btn-primary">✓ Одобрить</button><button data-s="rejected" class="decision btn btn-danger">✕ Отказать</button><button data-s="postponed" class="decision btn btn-warning">Ⅱ Отложить</button><button data-s="cancelled" class="decision btn btn-secondary">Отменить</button>':''}</div></section></section></div>`;document.getElementById('receive')?.addEventListener('click',async()=>{try{gamePrompt('Заявление получено ведомством');await ZB.adminReceive(id);location.reload()}catch(e){alert(e.message)}});document.getElementById('review')?.addEventListener('click',async()=>{try{const d=gamePrompt('Начато рассмотрение');if(d===null)return;await ZB.adminStartReview(id);location.reload()}catch(e){alert(e.message)}});document.querySelectorAll('.decision').forEach(b=>b.onclick=async()=>{try{const d=gamePrompt('Решение: '+st[b.dataset.s]);if(d===null)return;const c=prompt('Комментарий администратора (необязательно):','')||'';await ZB.adminDecision(id,b.dataset.s,c,d);location.reload()}catch(e){alert(e.message)}})}catch(e){document.getElementById('app').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
