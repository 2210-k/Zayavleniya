<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дело — Администрация</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/admin-application.css">
<script src="js/supabase-config.js?v=20260815-50"></script>
<script src="js/supabase.js?v=20260815-50"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#e3e7eb;--text:#17202a;--muted:#6b7580;--accent:#202a35;--soft:#eef1f4;--danger:#b33a3a;--warn:#a36b16;--ok:#28734b;--shadow:0 12px 35px rgba(23,32,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app-shell{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text)}.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.topbar-actions{display:flex;align-items:center;gap:10px}.admin-badge{font-size:10px;font-weight:800;letter-spacing:.08em;background:#eef0f2;padding:9px 11px;border-radius:9px}.btn{border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#fff;border-color:var(--line);color:var(--text)}.btn-danger{background:#fff;border-color:#e4bebe;color:var(--danger)}.btn-warning{background:#fff;border-color:#e6d0aa;color:var(--warn)}.btn:disabled{opacity:.5;cursor:not-allowed}.review-page{max-width:1500px;margin:auto;padding:28px}.review-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.review-head h1{margin:5px 0 8px;font-size:27px;letter-spacing:-.02em}.eyebrow{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.12em}.review-head p{margin:0;color:var(--muted);font-size:12px}.status{padding:9px 12px;border-radius:9px;background:#eef1f4;font-size:11px;font-weight:800;white-space:nowrap}.review-grid{display:grid;grid-template-columns:260px minmax(420px,1fr) 360px;gap:18px;align-items:start}.info-card,.document,.attachments,.actions-card,.message-panel,.appeal-card,.danger-zone{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.info-card{padding:18px;margin-bottom:18px}.info-card h3,.attachments h3,.message-panel h3,.appeal-card h3,.actions-card h3,.danger-zone h3{margin:0 0 14px;font-size:13px}.info-card>b{display:block;font-size:15px;margin-bottom:12px}.info-card span{display:block;color:#53606c;font-size:11px;padding:6px 0;border-bottom:1px solid #f0f2f4}.info-card span:last-child{border-bottom:0}.document{padding:38px;min-height:620px;line-height:1.8;font-family:Georgia,"Times New Roman",serif;font-size:15px;color:#1c2024}.document h1,.document h2{text-align:center}.document p{margin:0 0 12px}.attachments,.actions-card,.appeal-card,.danger-zone{padding:18px;margin-top:18px}.attachment-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.attachment-row:last-child{border:0}.attachment-row a{color:var(--text);font-weight:700}.message-panel{position:sticky;top:90px;padding:16px}.message-panel>p{font-size:10px;color:var(--muted);margin-top:-8px}.chat{display:flex;flex-direction:column;gap:9px;max-height:560px;overflow:auto;padding:4px 2px 10px}.message{max-width:88%;padding:11px 13px;border-radius:13px;background:#f0f2f4;border:1px solid #e0e4e7}.message.citizen{align-self:flex-start}.message.admin{align-self:flex-end;background:#202a35;color:#fff;border-color:#202a35}.message small{display:flex;justify-content:space-between;gap:8px;font-size:9px;opacity:.65;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45}.msg-delete{border:0;background:transparent;color:inherit;cursor:pointer;font-size:9px;padding:0}.message-form textarea,.decision-form input,.decision-form textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font:inherit;font-size:12px;resize:vertical}.message-form textarea{min-height:90px}.message-form button{width:100%;margin-top:8px}.decision-form{display:grid;grid-template-columns:130px 1fr;gap:10px;margin-top:12px}.decision-form label{font-size:10px;font-weight:800;color:var(--muted);padding-top:11px}.decision-form .full{grid-column:1/-1}.decision-form textarea{min-height:90px}.actions{display:flex;flex-wrap:wrap;gap:8px}.appeal-card{border-color:#e4d5b4;background:#fffdf8}.appeal-meta{font-size:11px;color:var(--muted);margin-bottom:8px}.danger-zone{border-color:#ead7d7}.muted{color:var(--muted);font-size:12px}.timeline{display:flex;flex-direction:column;gap:12px}.timeline span{font-size:11px;border-left:2px solid #d9dee3;padding-left:10px}.timeline b{display:block;font-size:10px;margin-bottom:3px}.timeline small{display:block;color:var(--muted);margin-top:3px}@media(max-width:1150px){.review-grid{grid-template-columns:220px 1fr}.message-panel{grid-column:1/-1;position:static}.chat{max-height:350px}}@media(max-width:720px){.topbar{padding:0 14px;height:64px}.topbar .admin-badge{display:none}.review-page{padding:15px}.review-head{display:block}.review-head .status{display:inline-block;margin-top:12px}.review-grid{grid-template-columns:1fr}.document{padding:22px;min-height:400px;font-size:14px}.decision-form{grid-template-columns:1fr}.decision-form label,.decision-form .full{grid-column:auto}.topbar-actions .btn{padding:9px}.brand small{display:none}}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
<a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Рабочее место ведомства</small></span></a>
<div class="topbar-actions"><span class="admin-badge">АДМИНИСТРАТОР</span><a class="btn btn-secondary" href="admin-applications.html">← К заявлениям</a></div>
</header>
<main class="review-page"><div id="app"><p class="muted">Загрузка дела…</p></div></main>
</div>
<script>
const id=new URLSearchParams(location.search).get('id');
const ST={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};
const AST={pending:'Требует внимания',accepted:'Удовлетворено',rejected:'Отклонено',cancelled:'Отменено'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const date=s=>s?new Date(s).toLocaleString('ru-RU'):'—';
function btn(s,t,c='btn-secondary'){return `<button class="btn ${c} decision" data-s="${s}">${t}</button>`}
async function render(){
 const me=await ZB.currentUser();
 const a=await ZB.getApplication(id); if(!a)throw new Error('Заявление не найдено.');
 const h=await ZB.getHistory(id),msgs=await ZB.listMessages(id),atts=await ZB.listAttachments(id);
 const appeals=await ZB.listAppealsAdmin(); const appeal=appeals.find(x=>x.application_id===id); const p=a.profiles||{};
 const att=atts.length?atts.map(x=>`<div class="attachment-row"><span>📎 ${esc(x.file_name)}</span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<span class="muted">Вложений нет.</span>';
 const chat=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===me.id?'admin':'citizen'}"><small><span>${m.sender_id===me.id?'ВЕДОМСТВО':'ГРАЖДАНИН'} · ${date(m.created_at)}</span>${m.sender_id===me.id?`<button class="msg-delete" data-mid="${m.id}">Удалить</button>`:''}</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Переписка пока пуста.</p>';
 let decision='';
 if(['reviewing','received'].includes(a.status)) decision=`<div class="decision-form"><label>Игровой день</label><input id="decisionDay" type="number" min="0" placeholder="Например: 27"><label>Комментарий</label><textarea id="decisionComment" class="full" placeholder="Основание, условия или комментарий к решению"></textarea><div class="actions full">${btn('approved','Одобрить','btn-primary')}${btn('rejected','Отказать','btn-danger')}${btn('postponed','Отложить','btn-warning')}${btn('cancelled','Отменить')}</div></div>`;
 let appealHtml='';
 if(appeal) appealHtml=`<section class="appeal-card"><h3>⚖ Оспаривание</h3><div class="appeal-meta">Статус: <b>${esc(AST[appeal.status]||appeal.status)}</b> · ${date(appeal.created_at)}</div><p>${esc(appeal.reason)}</p>${appeal.status==='pending'?`<div class="decision-form"><label>Игровой день</label><input id="appealDay" type="number" min="0" placeholder="Например: 30"><label>Комментарий</label><textarea id="appealComment" class="full" placeholder="Основание решения по оспариванию"></textarea><div class="actions full"><button id="appealAccept" class="btn btn-primary">Удовлетворить</button><button id="appealReject" class="btn btn-danger">Отклонить</button><button id="appealCancel" class="btn btn-secondary">Отменить</button></div></div>`:`<p class="muted">Комментарий: ${esc(appeal.admin_comment||'—')}</p>`}</section>`;
 let workflow='';
 if(a.status==='submitted')workflow='<button id="receive" class="btn btn-primary">Получить заявление</button>';
 if(['submitted','received'].includes(a.status))workflow+='<button id="review" class="btn btn-secondary">Начать рассмотрение</button>';
 document.getElementById('app').innerHTML=`
 <div class="review-head"><div><div class="eyebrow">ДЕЛО №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(ST[a.status]||a.status)} · ${date(a.created_at)} · игровой день ${esc(a.submitted_game_day??'—')}</p></div><span class="status">${esc(ST[a.status]||a.status)}</span></div>
 <div class="review-grid">
 <aside><section class="info-card"><h3>Заявитель</h3><b>${esc(p.full_name||'—')}</b><span>Дата рождения: ${esc(p.birth_date||'—')}</span><span>Паспорт: ${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}</span><span>Кем выдан: ${esc(p.passport_issuer||'—')}</span><span>Дата выдачи: ${esc(p.passport_issue_date||'—')}</span><span>Гражданство: ${esc(p.citizenship||'—')}</span><span>Место рождения: ${esc(p.birth_place||'—')}</span><span>Национальность: ${esc(p.nationality||'—')}</span><span>Проживание: ${esc(p.residence_address||'—')}</span><span>Регистрация: ${esc(p.registration_address||'—')}</span></section><section class="info-card"><h3>Хронология</h3><div class="timeline">${h.map(x=>`<span><b>${date(x.real_date||x.created_at)} · ${esc(x.game_day??'—')} день</b>${esc(x.action)}${x.comment?`<small>${esc(x.comment)}</small>`:''}</span>`).join('')||'<span>История пуста.</span>'}</div></section></aside>
 <section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article><section class="attachments"><h3>Вложения</h3>${att}<input id="file" type="file" style="margin-top:12px;width:100%"><button id="upload" class="btn btn-secondary" style="margin-top:8px">Прикрепить файл</button></section>${appealHtml}<section class="actions-card"><h3>Действия по делу</h3><div class="actions">${workflow}</div>${decision}</section><section class="danger-zone"><h3>Обслуживание</h3><div class="actions"><button id="clearMessages" class="btn btn-secondary">Очистить сообщения</button><button id="clearHistory" class="btn btn-secondary">Очистить историю</button><button id="deleteApp" class="btn btn-danger">Удалить заявление</button></div></section></section>
 <aside class="message-panel"><h3>Переписка</h3><p>Без игровой даты · реальное время</p><div id="chat" class="chat">${chat}</div><form id="messageForm" class="message-form"><textarea id="message" maxlength="4000" required placeholder="Напишите гражданину…"></textarea><button class="btn btn-primary" type="submit">Отправить</button></form></aside>
 </div>`;
 bind(appeal);
 document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();try{window.open(await ZB.attachmentUrl(x.dataset.file),'_blank','noopener')}catch(err){alert(err.message)}});
 document.getElementById('upload').onclick=async()=>{try{const f=document.getElementById('file').files[0];if(!f)return alert('Выберите файл.');await ZB.uploadAttachment(id,f);await render()}catch(e){alert(e.message)}};
}
async function bind(appeal){
 document.getElementById('receive')?.addEventListener('click',async()=>{const d=prompt('Игровой день получения:','');if(d!==null)try{await ZB.adminReceive(id,d);await render()}catch(e){alert(e.message)}});
 document.getElementById('review')?.addEventListener('click',async()=>{const d=prompt('Игровой день начала рассмотрения:','');if(d!==null)try{await ZB.adminStartReview(id,d);await render()}catch(e){alert(e.message)}});
 document.querySelectorAll('.decision').forEach(b=>b.onclick=async()=>{const d=document.getElementById('decisionDay')?.value;if(d==='')return alert('Укажите игровой день.');try{await ZB.adminDecision(id,b.dataset.s,document.getElementById('decisionComment').value,d);await render()}catch(e){alert(e.message)}});
 if(appeal){const resolve=async status=>{const d=document.getElementById('appealDay')?.value;if(d==='')return alert('Укажите игровой день.');try{await ZB.resolveAppealAdmin(appeal.id,status,document.getElementById('appealComment').value,d);await render()}catch(e){alert(e.message)}};document.getElementById('appealAccept')?.addEventListener('click',()=>resolve('accepted'));document.getElementById('appealReject')?.addEventListener('click',()=>resolve('rejected'));document.getElementById('appealCancel')?.addEventListener('click',()=>resolve('cancelled'));}
 document.querySelectorAll('.msg-delete').forEach(b=>b.onclick=async()=>{if(confirm('Удалить это сообщение?'))try{await ZB.deleteMessage(b.dataset.mid);await render()}catch(e){alert(e.message)}});
 document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,document.getElementById('message').value);await render()}catch(err){alert(err.message)}finally{b.disabled=false}};
 document.getElementById('clearMessages').onclick=async()=>{if(confirm('Очистить всю переписку?'))try{await ZB.clearMessages(id);await render()}catch(e){alert(e.message)}};
 document.getElementById('clearHistory').onclick=async()=>{if(confirm('Удалить историю действий?'))try{await ZB.clearHistory(id);await render()}catch(e){alert(e.message)}};
 document.getElementById('deleteApp').onclick=async()=>{if(confirm('Удалить заявление навсегда?'))try{await ZB.deleteApplication(id);location.href='admin-applications.html'}catch(e){alert(e.message)}};
}
async function boot(){if(!await ZB.requireAdmin())return;if(!id){location.href='admin-applications.html';return}try{await render()}catch(e){document.getElementById('app').innerHTML=`<div class="info-card"><h3>Не удалось открыть дело</h3><p class="muted">${esc(e.message)}</p><a class="btn btn-secondary" href="admin-applications.html">Вернуться к заявлениям</a></div>`}}
boot();
</script>
</body>
</html>
