<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карточка заявления — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-application.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Карточка заявления</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="admin.html">← Входящие</a><a class="btn btn-secondary" id="messagesLink" href="#">💬 Сообщения</a></div></header><main class="review-page"><div id="app"><p class="muted">Загрузка…</p></div></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function gamePrompt(label){const x=prompt(label+'\n\nИгровой день:', '');if(x===null)return null;if(!/^\d+$/.test(x))throw Error('Игровой день должен быть целым числом от 0 и выше.');return Number(x)}async function boot(){const p=await ZB.requireAdmin();if(!p)return;if(!id){location.href='admin.html';return}try{const a=await ZB.getApplication(id),h=await ZB.getHistory(id);document.getElementById('messagesLink').href='admin-messages.html?id='+id;document.getElementById('app').innerHTML=`<div class="review-head"><div><div class="eyebrow">ЗАЯВЛЕНИЕ №${String(a.application_number).padStart(6,'0')}</div><h1>${esc(a.title)}</h1><p>${esc(st[a.status]||a.status)} · ${new Date(a.created_at).toLocaleDateString('ru-RU')} (${esc(a.submitted_game_day??'—')} день)</p></div><span class="status ${a.status==='approved'?'status-approved':a.status==='rejected'?'status-danger':'status-review'}">${esc(st[a.status]||a.status)}</span></div><div class="review-grid"><aside><section class="info-card"><h3>Заявитель</h3><b>${esc(a.profiles?.full_name||'—')}</b><span>Дата рождения: ${esc(a.profiles?.birth_date||'—')}</span><span>Паспорт: ${esc(a.profiles?.passport_series||'')} ${esc(a.profiles?.passport_number||'')}</span><span>Кем выдан: ${esc(a.profiles?.passport_issuer||'—')}</span><span>Выдан: ${esc(a.profiles?.passport_issue_date||'—')}</span><span>Гражданство: ${esc(a.profiles?.citizenship||'—')}</span><span>Место рождения: ${esc(a.profiles?.birth_place||'—')}</span><span>Национальность: ${esc(a.profiles?.nationality||'—')}</span><span>Проживание: ${esc(a.profiles?.residence_address||'—')}</span><span>Регистрация: ${esc(a.profiles?.registration_address||'—')}</span></section><section class="info-card"><h3>История</h3><div class="timeline">${h.map(x=>`<span><b>${new Date(x.real_date||x.created_at).toLocaleDateString('ru-RU')} (${esc(x.game_day??'—')} день)</b>${esc(x.action)}${x.comment?'<small>'+esc(x.comment)+'</small>':''}</span>`).join('')||'<span>История пуста.</span>'}</div></section></aside><section><article class="document">${a.generated_document||'<p>Документ отсутствует.</p>'}</article><section class="actions"><h3>Работа с заявлением</h3><p class="muted">Реальная дата фиксируется автоматически. Игровой день вводится отдельно для каждого действия.</p><div class="action-grid">${a.status==='submitted'?'<button id="receive" class="btn btn-primary">Получить заявление</button>':''}${['submitted','received'].includes(a.status)?'<button id="review" class="btn btn-secondary">Начать рассмотрение</button>':''}${['reviewing','received'].includes(a.status)?'<button data-s="approved" class="decision btn btn-primary">✓ Одобрить</button><button data-s="rejected" class="decision btn btn-danger">✕ Отказать</button><button data-s="postponed" class="decision btn btn-warning">Ⅱ Отложить</button><button data-s="cancelled" class="decision btn btn-secondary">Отменить</button>':''}<a class="btn btn-secondary" href="admin-messages.html?id=${id}">💬 Открыть переписку</a></div></section><section class="danger-zone"><h3>Обслуживание заявления</h3><p>Эти действия необратимы. Они доступны только администратору.</p><div class="action-grid"><button id="clearMessages" class="btn btn-secondary">Очистить сообщения</button><button id="clearHistory" class="btn btn-secondary">Очистить историю</button><button id="deleteApp" class="btn btn-danger">Удалить заявление</button></div></section></section></div>`;document.getElementById('receive')?.addEventListener('click',async()=>{try{const d=gamePrompt('Получение заявления');if(d===null)return;await ZB.adminReceive(id,d);location.reload()}catch(e){alert(e.message)}});document.getElementById('review')?.addEventListener('click',async()=>{try{const d=gamePrompt('Начало рассмотрения');if(d===null)return;await ZB.adminStartReview(id,d);location.reload()}catch(e){alert(e.message)}});document.querySelectorAll('.decision').forEach(b=>b.onclick=async()=>{try{const d=gamePrompt('Решение: '+st[b.dataset.s]);if(d===null)return;const c=prompt('Комментарий администратора:','')||'';await ZB.adminDecision(id,b.dataset.s,c,d);location.reload()}catch(e){alert(e.message)}});document.getElementById('clearMessages').onclick=async()=>{if(confirm('Очистить все сообщения по этому заявлению?')){await ZB.clearMessages(id);location.reload()}};document.getElementById('clearHistory').onclick=async()=>{if(confirm('Удалить всю историю действий этого заявления?')){await ZB.clearHistory(id);location.reload()}};document.getElementById('deleteApp').onclick=async()=>{if(confirm('УДАЛИТЬ ЗАЯВЛЕНИЕ НАВСЕГДА? Это действие нельзя отменить.')){await ZB.deleteApplication(id);location.href='admin.html'}}}catch(e){document.getElementById('app').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}boot();</script></body></html>
