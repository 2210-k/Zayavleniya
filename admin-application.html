<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело — Ведомство</title><style>:root{--bg:#f4f6f8;--card:#fff;--line:#e3e7eb;--text:#17202a;--muted:#697583;--dark:#202a35;--ok:#28734b;--bad:#a43b3b;--warn:#98691a;--shadow:0 10px 30px #17202a0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;font-weight:750;font-size:12px;cursor:pointer}.btn:hover{box-shadow:0 4px 12px #0001}.primary{background:var(--dark);border-color:var(--dark);color:#fff}.ok{color:var(--ok)}.danger{color:var(--bad)}.warn{color:var(--warn)}.page{max-width:1500px;margin:auto;padding:22px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.13em;color:var(--muted)}h1{font-size:24px;letter-spacing:-.025em;margin:5px 0}.muted{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:270px minmax(450px,1fr) 350px;gap:15px}.card,.doc{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:16px;margin-bottom:15px}.card h2{font-size:13px;margin:0 0 12px}.doc{padding:46px;min-height:620px;font:15px/1.8 Georgia,"Times New Roman",serif}.doc h1,.doc h2{text-align:center}.kv{padding:7px 0;border-bottom:1px solid #f0f1f3;font-size:11px}.kv b{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}.timeline{display:grid;gap:8px}.event{border-left:2px solid #dfe4e8;padding-left:9px;font-size:10px}.event b{display:block;font-size:9px}.chat{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}.msg{max-width:88%;padding:10px 11px;border-radius:12px;background:#f2f4f5;border:1px solid var(--line);font-size:11px}.msg.admin{align-self:flex-end;background:#202a35;color:#fff;border-color:#202a35}.msg small{display:block;opacity:.65;font-size:8px;margin-bottom:4px}.msg p{margin:0;white-space:pre-wrap}.msg button{margin-top:6px;border:0;background:none;color:inherit;opacity:.65;font-size:9px;cursor:pointer}.field{margin:8px 0}.field label{display:block;font-size:9px;font-weight:850;color:var(--muted);margin-bottom:5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:12px;background:#fff}textarea{min-height:75px;resize:vertical}.form-card{border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:8px}.form-card strong{font-size:12px}.form-card small{display:block;color:var(--muted);margin-top:3px}.file{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f0f1f3;font-size:11px}.file a{font-weight:750;color:var(--text)}.appeal{background:#fffaf0;border-color:#ead9b8}.danger-zone{border-color:#ead1d1}@media(max-width:1100px){.grid{grid-template-columns:235px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.top{padding:0 12px}.page{padding:12px}.grid{grid-template-columns:1fr}.doc{padding:25px;min-height:420px}.head{display:block}.head .actions{margin-top:10px}}
</style></head><body><header class="top"><div class="brand">ВЕДОМСТВО<small>Рабочее место администратора</small></div><div class="actions"><button class="btn" onclick="location.href='admin-applications.html'">← Заявления</button><button class="btn" onclick="location.href='admin.html'">Обзор</button></div></header><main class="page"><div id="app"><section class="card">Загрузка дела…</section></div></main><script src="js/supabase-config.js?v=20260815-80"></script><script src="js/supabase.js?v=20260815-80"></script><script>
const id=new URLSearchParams(location.search).get('id');const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const DT=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const ST={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено'};
async function load(){if(!id)throw Error('Не указан id заявления.');const a=await ZB.getApplication(id);if(!a)throw Error('Заявление не найдено.');const me=await ZB.currentUser(),p=a.profiles||{};const [hist,msgs,files,forms,aps]=await Promise.all([ZB.getHistory(id),ZB.listMessages(id),ZB.listAttachments(id),ZB.listApplicationForms(id),ZB.listAppealsAdmin()]);const ap=aps.find(x=>String(x.application_id)===String(id));const chat=msgs.length?msgs.map(m=>'<div class="msg '+(m.sender_id===me.id?'admin':'')+'"><small>'+(m.sender_id===me.id?'ВЕДОМСТВО':'ГРАЖДАНИН')+' · '+DT(m.created_at)+'</small><p>'+E(m.message)+'</p>'+(m.sender_id===me.id?'<button data-del-msg="'+E(m.id)+'">Удалить</button>':'')+'</div>').join(''):'<span class="muted">Переписка пуста.</span>';const at=files.length?files.map(f=>'<div class="file"><span>📎 '+E(f.file_name)+'</span><span><a href="#" data-file="'+E(f.file_path)+'">Открыть</a> · <a href="#" data-del-file="'+E(f.id)+'" data-path="'+E(f.file_path)+'">Удалить</a></span></div>').join(''):'<span class="muted">Вложений нет.</span>';const hs=hist.length?hist.map(x=>'<div class="event"><b>'+DT(x.real_date||x.created_at)+' · '+E(x.game_day??'—')+' день</b>'+E(x.action)+(x.comment?'<br>'+E(x.comment):'')+'</div>').join(''):'<span class="muted">История пуста.</span>';const fs=forms.length?forms.map(f=>'<div class="form-card"><strong>'+E(f.title||'Дополнительная форма')+'</strong><small>'+E(f.status||'pending')+' · '+DT(f.created_at)+'</small>'+(f.response_data?'<small>Ответ гражданина получен</small>':'<small>Ответ гражданина ожидается</small>')+'</div>').join(''):'<span class="muted">К этому делу пока ничего не привязано.</span>';let decision='';if(['received','reviewing'].includes(a.status))decision='<section class="card"><h2>Решение по делу</h2><div class="field"><label>ИГРОВОЙ ДЕНЬ</label><input id="day" type="number" min="0" placeholder="Например: 27"></div><div class="field"><label>ОСНОВАНИЕ РЕШЕНИЯ</label><textarea id="comment" placeholder="Укажите причину и дополнительные сведения"></textarea></div><div class="actions"><button class="btn ok" data-dec="approved">Одобрить</button><button class="btn danger" data-dec="rejected">Отказать</button><button class="btn warn" data-dec="postponed">Отложить</button><button class="btn" data-dec="cancelled">Отменить</button></div></section>';let appeal='<section class="card appeal"><h2>⚖ Оспаривание</h2>';if(!ap)appeal+='<p class="muted">По этому делу активного оспаривания нет.</p>';else{appeal+='<p>'+E(ap.reason||'Причина не указана')+'</p><p class="muted">Статус: '+E(ap.status)+'</p>';if(ap.status==='pending')appeal+='<div class="field"><label>ИГРОВОЙ ДЕНЬ</label><input id="ad" type="number" min="0" placeholder="Например: 30"></div><div class="field"><label>РЕШЕНИЕ АДМИНИСТРАЦИИ</label><textarea id="ac" placeholder="Обоснование решения"></textarea></div><div class="actions"><button class="btn ok" id="acceptAppeal">Удовлетворить</button><button class="btn danger" id="rejectAppeal">Отклонить</button><button class="btn" id="cancelAppeal">Отменить</button></div>'}appeal+='</section>';document.getElementById('app').innerHTML='<div class="head"><div><div class="eyebrow">ДЕЛО №'+E(String(a.application_number).padStart(6,'0'))+'</div><h1>'+E(a.title)+'</h1><div class="muted">'+E(ST[a.status]||a.status)+' · '+DT(a.created_at)+' · игровой день '+E(a.submitted_game_day??'—')+'</div></div><div class="actions"><button class="btn" onclick="location.href=\'admin-applications.html\'">← К заявлениям</button></div></div><div class="grid"><aside><section class="card"><h2>Заявитель</h2><b>'+E(p.full_name||'—')+'</b><div class="kv"><b>Дата рождения</b>'+E(p.birth_date||'—')+'</div><div class="kv"><b>Паспорт</b>'+E(p.passport_series||'—')+' '+E(p.passport_number||'—')+'</div><div class="kv"><b>Кем выдан</b>'+E(p.passport_issuer||'—')+'</div><div class="kv"><b>Дата выдачи</b>'+E(p.passport_issue_date||'—')+'</div><div class="kv"><b>Гражданство</b>'+E(p.citizenship||'—')+'</div><div class="kv"><b>Место рождения</b>'+E(p.birth_place||'—')+'</div><div class="kv"><b>Национальность</b>'+E(p.nationality||'—')+'</div><div class="kv"><b>Проживание</b>'+E(p.residence_address||'—')+'</div><div class="kv"><b>Регистрация</b>'+E(p.registration_address||'—')+'</div></section><section class="card"><h2>История дела</h2><div class="timeline">'+hs+'</div></section></aside><section><article class="doc">'+(a.generated_document||'<p>Документ отсутствует.</p>')+'</article><section class="card"><h2>Вложения дела</h2>'+at+'<input id="file" type="file" style="margin-top:10px"><button class="btn" id="upload" style="margin-top:8px">Прикрепить файл</button></section><section class="card"><h2>Формы по этому делу</h2>'+fs+'<button class="btn" id="newForm" style="margin-top:10px">Создать / отправить форму</button></section>'+appeal+decision+'<section class="card danger-zone"><h2>Обслуживание дела</h2><div class="actions"><button class="btn" id="clearHistory">Очистить историю</button><button class="btn" id="clearMessages">Удалить переписку</button><button class="btn danger" id="deleteApp">Удалить заявление</button></div></section></section><aside class="right"><section class="card"><h2>Переписка</h2><p class="muted">Дата здесь не запрашивается. Сообщения разделены по отправителю.</p><div class="chat">'+chat+'</div><form id="send" style="margin-top:10px"><textarea id="text" placeholder="Напишите гражданину…" required></textarea><button class="btn primary" style="width:100%;margin-top:7px">Отправить</button></form></section></aside></div>';document.querySelectorAll('[data-del-msg]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить это сообщение?')){await ZB.deleteMessage(b.dataset.delMsg);load()}});document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async e=>{e.preventDefault();try{window.open(await ZB.attachmentUrl(b.dataset.file),'_blank')}catch(x){alert(x.message)}});document.querySelectorAll('[data-del-file]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(confirm('Удалить вложение?')){await ZB.deleteAttachment(b.dataset.delFile,b.dataset.path);load()}});document.getElementById('send').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('text').value.trim();if(!t)return;await ZB.sendMessage(id,t);load()};document.getElementById('upload').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return alert('Выберите файл.');try{await ZB.uploadAttachment(id,f);load()}catch(x){alert(x.message)}};document.getElementById('newForm').onclick=()=>location.href='admin-forms.html?application_id='+encodeURIComponent(id)+'&citizen_id='+encodeURIComponent(a.citizen_id);document.getElementById('clearHistory').onclick=async()=>{if(confirm('Очистить историю этого дела?')){await ZB.clearHistory(id);load()}};document.getElementById('clearMessages').onclick=async()=>{if(confirm('Удалить всю переписку?')){await ZB.clearMessages(id);load()}};document.getElementById('deleteApp').onclick=async()=>{if(confirm('Удалить заявление полностью?')){await ZB.deleteApplication(id);location.href='admin-applications.html'}};document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{const d=Number(document.getElementById('day').value),c=document.getElementById('comment').value.trim();if(!Number.isInteger(d)||d<0||!c)return alert('Заполните игровой день и основание решения.');await ZB.decideApplication(id,b.dataset.dec,d,c);load()});if(ap&&ap.status==='pending')for(const [el,status] of [['acceptAppeal','accepted'],['rejectAppeal','rejected'],['cancelAppeal','cancelled']])document.getElementById(el).onclick=async()=>{const d=Number(document.getElementById('ad').value),c=document.getElementById('ac').value.trim();if(!Number.isInteger(d)||d<0||!c)return alert('Заполните игровой день и решение.');await ZB.resolveAppealAdmin(ap.id,status,c,d);load()}}
load().catch(e=>document.getElementById('app').innerHTML='<section class="card"><h2>Не удалось открыть дело</h2><p class="muted">'+E(e.message)+'</p><button class="btn primary" onclick="location.href=\'admin-applications.html\'">Вернуться к заявлениям</button></section>');</script></body></html>
