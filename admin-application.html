<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело — Центр управления</title><link rel="stylesheet" href="redesign-v2/css/admin-v2.css?v=20260815-60"><script src="js/supabase-config.js?v=20260815-60"></script><script src="js/supabase.js?v=20260815-60"></script><style>.case-grid{display:grid;grid-template-columns:260px minmax(0,1fr) 330px;gap:12px}.panel{background:linear-gradient(180deg,#151e27,#111820);border:1px solid #28333e;border-radius:15px;padding:18px;margin-bottom:12px}.kv{padding:8px 0;border-bottom:1px solid #202a34;font-size:10px}.kv b{display:block;color:#697787;font-size:8px;letter-spacing:.08em;margin-bottom:2px}.doc{background:#fff;color:#171b20;border-radius:5px;padding:50px;min-height:650px;font:15px/1.75 Georgia,"Times New Roman",serif;overflow:auto;box-shadow:0 20px 60px #0005}.timeline{display:grid;gap:9px}.event{border-left:2px solid #344252;padding-left:9px;font-size:9px;color:#aeb8c3}.event b{display:block;color:#dce3e9;margin-bottom:2px}.chat{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}.msg{padding:10px;border:1px solid #28333e;border-radius:11px;background:#0b1117;font-size:10px}.msg.me{background:#182530}.msg small{display:block;color:#6f7d8d;font-size:8px;margin-bottom:4px}.msg p{margin:0;white-space:pre-wrap}.field{display:grid;gap:6px;margin:9px 0}.field label{font-size:8px;color:#8794a4;font-weight:850}.field input,.field textarea{width:100%;box-sizing:border-box;background:#0b1117;color:#eef2f5;border:1px solid #28333e;border-radius:9px;padding:10px;font:inherit;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.files{display:grid;gap:5px}.file{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #202a34;font-size:9px}.file a{color:#dce3e9}.danger{border-color:#5b3039}.danger .v2-btn{color:#ff9da7;border-color:#5b3039}.case-note{padding:10px;border:1px solid #2b3946;border-radius:10px;background:#0d141b;color:#7f8c9b;font-size:9px;margin-bottom:10px}@media(max-width:1100px){.case-grid{grid-template-columns:230px 1fr}.right{grid-column:1/-1}}@media(max-width:750px){.case-grid{grid-template-columns:1fr}.doc{padding:25px;min-height:450px}}
</style></head><body><div class="v2-shell"><header class="v2-top"><a class="v2-brand" href="admin.html"><span class="v2-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Карточка дела</small></span></a><div class="v2-actions"><a class="v2-btn" href="admin-applications.html">← Заявления</a><a class="v2-btn" href="admin.html">Обзор</a></div></header><div class="v2-layout"><aside class="v2-side"><div class="v2-side-label">РАБОТА</div><nav class="v2-nav"><a href="admin.html">Обзор</a><a class="active" href="admin-applications.html">Заявления</a><a href="admin-appeals.html">Оспаривания</a><a href="admin-citizens.html">Граждане</a><a href="admin-messages.html">Сообщения</a><a href="admin-service.html">Обслуживание</a></nav></aside><main class="v2-main"><div id="app"><div class="v2-empty">Загрузка дела…</div></div></main></div></div><script>const id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const DT=x=>x?new Date(x).toLocaleString('ru-RU'):'—';const ST={submitted:'Новое',received:'Получено',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспаривание'};const $=x=>document.getElementById(x);async function load(){if(!await ZB.requireAdmin())return;if(!id)throw Error('Не указан id заявления.');const a=await ZB.getApplicationAdmin(id),p=a.profiles||{},[h,m,f]=await Promise.all([ZB.getHistory(id),ZB.listMessages(id),ZB.listAttachments(id)]);$('app').innerHTML=`<div class="v2-kicker">ДЕЛО №${String(a.application_number||'').padStart(6,'0')}</div><h1 class="v2-title">${esc(a.title||'Заявление')}</h1><p class="v2-sub">${esc(ST[a.status]||a.status)} · подано ${DT(a.real_submitted_at||a.created_at)} · игровой день ${esc(a.submitted_game_day??'—')}</p><div class="case-grid"><aside><section class="panel"><h3>Заявитель</h3><b>${esc(p.full_name||'—')}</b><div class="kv"><b>ДАТА РОЖДЕНИЯ</b>${esc(p.birth_date||'—')}</div><div class="kv"><b>ПАСПОРТ</b>${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}</div><div class="kv"><b>ВЫДАН</b>${esc(p.passport_issuer||'—')}</div><div class="kv"><b>ГРАЖДАНСТВО</b>${esc(p.citizenship||'—')}</div><div class="kv"><b>МЕСТО РОЖДЕНИЯ</b>${esc(p.birth_place||'—')}</div><div class="kv"><b>ПРОЖИВАНИЕ</b>${esc(p.residence_address||'—')}</div></section><section class="panel"><h3>История</h3><div class="timeline">${h.length?h.map(x=>`<div class="event"><b>${DT(x.real_date||x.created_at)} · игровой день ${esc(x.game_day??'—')}</b>${esc(x.action)}${x.comment?'<br>'+esc(x.comment):''}</div>`).join(''):'<span class="v2-sub">История пуста.</span>'}</div></section></aside><section><article class="doc">${a.generated_document||'<p>Сформированный документ отсутствует.</p>'}</article><section class="panel"><h3>Действия по делу</h3><div class="field"><label>ИГРОВОЙ ДЕНЬ</label><input id="day" type="number" min="0" placeholder="Например, 15"></div><div class="field"><label>КОММЕНТАРИЙ</label><textarea id="comment" rows="4" placeholder="Основание решения"></textarea></div><div class="actions">${a.status==='submitted'?'<button class="v2-btn primary" data-act="receive">Получить</button>':''}${a.status==='received'?'<button class="v2-btn warn" data-act="review">Начать рассмотрение</button>':''}${a.status==='reviewing'?'<button class="v2-btn good" data-act="approved">Одобрить</button><button class="v2-btn bad" data-act="rejected">Отклонить</button><button class="v2-btn warn" data-act="postponed">Отложить</button><button class="v2-btn bad" data-act="cancelled">Отменить</button>':''}</div></section><section class="panel"><h3>Приложения к делу</h3><div class="case-note">Гражданин может прикрепить файлы непосредственно к заявлению. Отдельного конструктора «собственных форм» в системе больше нет.</div><div class="files">${f.length?f.map(x=>`<div class="file"><span>📎 ${esc(x.file_name)} <small style="color:#697787">${x.file_size?Math.ceil(x.file_size/1024)+' КБ':''}</small></span><a href="#" data-file="${esc(x.file_path)}">Открыть</a></div>`).join(''):'<span class="v2-sub">Приложений пока нет.</span>'}</div></section></section><aside class="right"><section class="panel"><h3>Переписка</h3><div class="chat">${m.length?m.map(x=>`<div class="msg ${x.sender_id===a.citizen_id?'':'me'}"><small>${DT(x.created_at)}</small><p>${esc(x.message)}</p></div>`).join(''):'<span class="v2-sub">Сообщений нет.</span>'}</div><form id="send"><div class="field"><textarea id="text" rows="3" placeholder="Сообщение гражданину"></textarea></div><button class="v2-btn primary" style="width:100%">Отправить</button></form></section><section class="panel danger"><h3>Обслуживание</h3><div class="actions"><button class="v2-btn" id="clearHistory">Очистить историю</button><button class="v2-btn" id="clearMessages">Очистить сообщения</button><button class="v2-btn" id="delete">Удалить дело</button></div></section></aside></div>`;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{try{const d=Number($('day').value),c=$('comment').value.trim();if(!Number.isInteger(d)||d<0)throw Error('Укажите игровой день.');if(b.dataset.act==='receive')await ZB.adminReceive(id,d);else if(b.dataset.act==='review')await ZB.adminStartReview(id,d);else await ZB.decideApplication(id,b.dataset.act,d,c);await load()}catch(e){alert(e.message)}});$('send').onsubmit=async e=>{e.preventDefault();const t=$('text').value.trim();if(!t)return;try{await ZB.sendMessage(id,t);await load()}catch(x){alert(x.message)}};document.querySelectorAll('[data-file]').forEach(x=>x.onclick=async e=>{e.preventDefault();try{window.open(await ZB.attachmentUrl(x.dataset.file),'_blank','noopener')}catch(z){alert(z.message)}});$('clearHistory').onclick=async()=>{if(confirm('Очистить историю?')){await ZB.clearHistory(id);load()}};$('clearMessages').onclick=async()=>{if(confirm('Очистить переписку?')){await ZB.clearMessages(id);load()}};$('delete').onclick=async()=>{if(confirm('Удалить заявление полностью?')){await ZB.deleteApplication(id);location.href='admin-applications.html'}}}load().catch(e=>{$('app').innerHTML='<div class="v2-empty">Ошибка: '+esc(e.message)+'</div>'});</script></body></html>
