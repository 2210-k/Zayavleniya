<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — Центр управления</title><link rel="stylesheet" href="redesign-v2/css/admin-v2.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="v2-shell"><header class="v2-top"><a class="v2-brand" href="admin.html"><span class="v2-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Центр сообщений</small></span></a><div class="v2-actions"><a class="v2-btn" href="admin.html">Обзор</a><button class="v2-btn" id="logout">Выйти</button></div></header><div class="v2-layout"><aside class="v2-side"><div class="v2-side-label">РАБОТА</div><nav class="v2-nav"><a href="admin.html">Обзор</a><a href="admin-applications.html">Заявления</a><a href="admin-appeals.html">Оспаривания</a><a href="admin-forms.html">Формы</a><a href="admin-citizens.html">Граждане</a><a class="active" href="admin-messages.html">Сообщения</a><a href="admin-service.html">Обслуживание</a></nav></aside><main class="v2-main"><div class="v2-kicker">КОММУНИКАЦИИ</div><h1 class="v2-title">Сообщения</h1><p class="v2-sub">Выберите заявление и продолжите официальную переписку с гражданином.</p><div class="v2-split"><section class="v2-card"><input id="search" class="v2-input" placeholder="Поиск гражданина, номера или заявления"><div id="picker" style="display:grid;gap:7px;margin-top:10px"><div class="v2-empty">Загрузка…</div></div></section><section class="v2-card"><div class="v2-card-head"><div><h2 id="appNo">Выберите дело</h2><p id="meta">—</p></div><span id="status" class="v2-status warn">—</span></div><div id="chat" style="display:grid;gap:7px;max-height:430px;overflow:auto;margin-top:12px"><p class="v2-sub">Выберите диалог слева.</p></div><form id="form" style="display:none;margin-top:10px"><textarea id="text" class="v2-input" rows="4" placeholder="Сообщение гражданину"></textarea><button class="v2-btn primary" style="margin-top:7px;width:100%">Отправить</button></form></section></div></main></div></div><script>const st={submitted:'Новое',received:'Получено',reviewing:'Рассмотрение',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let apps=[],selected=null,me=null;const $=id=>document.getElementById(id);function picker(){const q=$('search').value.toLowerCase();const x=apps.filter(a=>[a.application_number,a.title,a.profiles?.full_name,a.profiles?.passport_number].join(' ').toLowerCase().includes(q));$('picker').innerHTML=x.length?x.map(a=>`<button class="v2-btn" style="text-align:left" data-id="${a.id}">№${String(a.application_number||'').padStart(6,'0')} · ${esc(a.profiles?.full_name||'Гражданин')} · ${esc(a.title)}</button>`).join(''):'<div class="v2-empty">Диалогов нет.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}async function select(id){selected=id;const a=await ZB.getApplication(id);$('appNo').textContent='№'+String(a.application_number||'').padStart(6,'0')+' · '+(a.title||'');$('meta').textContent=(a.profiles?.full_name||'Гражданин')+' · '+(st[a.status]||a.status);$('status').textContent=st[a.status]||a.status;$('form').style.display='block';const m=await ZB.listMessages(id);$('chat').innerHTML=m.length?m.map(x=>`<div class="v2-card" style="padding:11px"><small style="color:#718093">${x.sender_id===me.id?'Ведомство':'Гражданин'} · ${new Date(x.created_at).toLocaleString('ru-RU')}</small><div style="font-size:11px;margin-top:5px;white-space:pre-wrap">${esc(x.message)}</div></div>`).join(''):'<p class="v2-sub">Сообщений нет.</p>';const c=$('chat');c.scrollTop=c.scrollHeight}async function boot(){me=await ZB.requireAdmin();if(!me)return;logout.onclick=ZB.signOut;apps=await ZB.listApplicationsAdmin();picker()}$('search').oninput=picker;$('form').onsubmit=async e=>{e.preventDefault();if(!selected)return;const t=$('text').value.trim();if(!t)return;try{await ZB.sendMessage(selected,t);$('text').value='';await select(selected)}catch(x){alert(x.message)}};boot().catch(e=>alert(e.message));</script></body></html>
