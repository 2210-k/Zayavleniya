<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центр сообщений — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/messages.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Центр сообщений ведомства</small></span></a><div class="topbar-actions"><span class="admin-badge">АДМИНИСТРАТОР</span><a class="btn btn-secondary" href="admin.html">← Панель</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="admin-page"><div class="eyebrow">КОММУНИКАЦИИ</div><h1>Центр сообщений</h1><p class="muted">Все обращения граждан привязаны к конкретным заявлениям.</p><section class="message-center"><aside class="dialog-list"><input id="search" placeholder="Поиск гражданина или заявления"><div id="picker"><p class="muted">Загрузка…</p></div></aside><section class="conversation"><div class="conversation-head"><div><b id="appNo">Выберите заявление</b><strong id="appTitle">—</strong><small id="citizenMeta" class="muted">—</small></div><span id="appStatus" class="status status-review">—</span></div><div id="chat" class="chat"><p class="muted">Выберите диалог слева.</p></div><form id="messageForm" class="message-form" style="display:none"><textarea id="message" required maxlength="4000" placeholder="Напишите официальное сообщение гражданину..."></textarea><div class="message-compose"><label>Игровой день<input id="gameDay" required min="0" step="1" type="number" placeholder="Например, 15"></label><button class="btn btn-primary" type="submit">Отправить сообщение</button></div></form></section></section></main></div><script>const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let apps=[],selected=null,me=null;function renderPicker(){const q=document.getElementById('search').value.toLowerCase();const list=apps.filter(a=>{const p=a.profiles||{};return [a.application_number,a.title,p.full_name,p.passport_number].join(' ').toLowerCase().includes(q)});document.getElementById('picker').innerHTML=list.length?list.map(a=>`<button class="dialog-item ${a.id===selected?'active':''}" data-id="${a.id}"><b>№${String(a.application_number).padStart(6,'0')}</b><strong>${esc(a.profiles?.full_name||'Гражданин')}</strong><small>${esc(a.title)} · ${esc(st[a.status]||a.status)}</small></button>`).join(''):'<p class="muted">Диалогов нет.</p>';document.querySelectorAll('.dialog-item').forEach(b=>b.onclick=()=>select(b.dataset.id))}async function select(id){selected=id;renderPicker();const a=await ZB.getApplication(id);document.getElementById('appNo').textContent='№'+String(a.application_number).padStart(6,'0');document.getElementById('appTitle').textContent=a.title;document.getElementById('citizenMeta').textContent=(a.profiles?.full_name||'Гражданин')+' · Паспорт '+(a.profiles?.passport_series||'—')+' '+(a.profiles?.passport_number||'—');document.getElementById('appStatus').textContent=st[a.status]||a.status;document.getElementById('messageForm').style.display='block';const msgs=await ZB.listMessages(id);document.getElementById('chat').innerHTML=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===me.id?'citizen':'admin'}"><small>${esc(m.sender_id===me.id?'Ведомство':m.sender_name||'Гражданин')} · ${new Date(m.created_at).toLocaleString('ru-RU')} · ${esc(m.game_day??'—')} день</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Сообщений пока нет.</p>';const chat=document.getElementById('chat');chat.scrollTop=chat.scrollHeight}async function boot(){me=await ZB.requireAdmin();if(!me)return;document.getElementById('logout').onclick=ZB.signOut;apps=await ZB.listApplicationsAdmin();renderPicker();const id=new URLSearchParams(location.search).get('id');if(id&&apps.some(x=>x.id===id))select(id)}document.getElementById('search').oninput=renderPicker;document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(selected,document.getElementById('message').value.trim(),document.getElementById('gameDay').value);document.getElementById('message').value='';await select(selected)}catch(err){alert(err.message)}finally{b.disabled=false}};boot().catch(e=>alert(e.message));</script></body></html>
