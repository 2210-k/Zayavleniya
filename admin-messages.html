<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — Панель ведомства</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/messages.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Сообщения ведомства</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="admin.html">← Админка</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="admin-page"><div class="eyebrow">ВЕДОМСТВО</div><h1>Сообщения</h1><p class="muted">Диалоги с гражданами привязаны к заявлениям.</p><section class="conversation" style="max-width:1000px"><div class="conversation-head"><div><b id="appNo">Выберите заявление</b><strong id="appTitle">—</strong></div><span id="appStatus" class="status status-review">—</span></div><div id="picker" style="display:grid;gap:8px;margin:18px 0"></div><div id="chat" class="chat"><p class="muted">Выберите заявление.</p></div><form id="messageForm" class="message-form" style="display:none"><textarea id="message" required maxlength="4000" placeholder="Сообщение гражданину..."></textarea><div style="display:flex;gap:10px;justify-content:space-between;align-items:center"><input id="gameDay" required min="0" step="1" type="number" placeholder="Игровой день" style="max-width:180px"><button class="btn btn-primary" type="submit">Отправить</button></div></form></section></main></div><script>const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let selected=null,me=null;async function load(){me=await ZB.requireAdmin();if(!me)return;document.getElementById('logout').onclick=ZB.signOut;const apps=await ZB.listApplicationsAdmin();document.getElementById('picker').innerHTML=apps.length?apps.map(a=>`<button class="btn btn-secondary" data-id="${a.id}" style="text-align:left"><b>№${String(a.application_number).padStart(6,'0')}</b> · ${esc(a.profiles?.full_name||'Гражданин')} · ${esc(a.title)}</button>`).join(''):'<p class="muted">Заявлений нет.</p>';document.querySelectorAll('#picker [data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}async function select(id){selected=id;const a=await ZB.getApplication(id);document.getElementById('appNo').textContent='№'+String(a.application_number).padStart(6,'0');document.getElementById('appTitle').textContent=(a.profiles?.full_name||'Гражданин')+' — '+a.title;document.getElementById('appStatus').textContent=st[a.status]||a.status;document.getElementById('messageForm').style.display='block';const msgs=await ZB.listMessages(id);document.getElementById('chat').innerHTML=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===me.id?'citizen':'admin'}"><small>${esc(m.sender_id===me.id?'Ведомство':m.sender_name||'Гражданин')} · ${new Date(m.created_at).toLocaleDateString('ru-RU')} (${esc(m.game_day??'—')} день)</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Сообщений пока нет.</p>'}document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(selected,document.getElementById('message').value.trim(),document.getElementById('gameDay').value);document.getElementById('message').value='';await select(selected)}catch(err){alert(err.message)}finally{b.disabled=false}};load().catch(e=>alert(e.message));</script></body></html>
