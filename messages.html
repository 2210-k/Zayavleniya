<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — ГосПортал</title><link rel="stylesheet" href="css/main.css?v=20260815-60"><script src="js/supabase-config.js?v=20260815-60"></script><script src="js/supabase.js?v=20260815-60"></script><style>body{background:radial-gradient(circle at 75% -15%,#1b2835 0,transparent 35%),#080d14}.page{padding:30px 14px 60px}.conversation{max-width:820px;margin:20px auto 0;border:1px solid #2a3744;border-radius:18px;background:#0d1522;overflow:hidden;box-shadow:0 20px 60px #0004}.conversation-head{padding:18px;border-bottom:1px solid #273542;display:flex;justify-content:space-between;gap:15px;align-items:center}.conversation-head b,.conversation-head strong{display:block}.conversation-head strong{margin-top:5px}.chat{padding:18px;display:grid;gap:10px;min-height:300px;max-height:60vh;overflow:auto}.message{max-width:78%;padding:11px 13px;border-radius:14px}.message.citizen{justify-self:end;background:#e9edf2;color:#151a22}.message.admin{justify-self:start;background:#182233;border:1px solid #293852}.message small{display:block;font-size:10px;opacity:.65;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;line-height:1.5;font-size:11px}.composer{padding:15px;border-top:1px solid #273542}.composer textarea{width:100%;box-sizing:border-box;background:#0a111c;color:#fff;border:1px solid #2b3947;border-radius:12px;padding:12px;resize:vertical}.composer button{margin-top:8px;width:100%}.empty{padding:35px;text-align:center;color:#718091;border:1px dashed #33414f;border-radius:12px;font-size:11px}@media(max-width:600px){.message{max-width:92%}.conversation-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСПОРТАЛ</strong><small>Переписка с ведомством</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="applications.html">← Заявления</a><a class="btn btn-secondary" href="dashboard.html">Кабинет</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="eyebrow">ПЕРЕПИСКА ПО ДЕЛУ</div><h1>Сообщения</h1><p class="muted">Выберите заявление из раздела «Мои заявления», чтобы открыть связанную переписку.</p><section class="conversation"><div class="conversation-head"><div><b id="appNo">Заявление</b><strong id="appTitle">Загрузка…</strong></div><span id="appStatus" class="status status-review">—</span></div><div id="chat" class="chat"><p class="muted">Загрузка…</p></div><form id="messageForm" class="composer"><textarea id="message" rows="4" required maxlength="4000" placeholder="Введите сообщение для ведомства…"></textarea><button class="btn btn-primary" type="submit">Отправить сообщение</button></form></section></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const $=id=>document.getElementById(id);async function load(){const p=await ZB.requireCitizen();if(!p)return;if(!id){location.replace('applications.html');return}logout.onclick=ZB.signOut;try{const a=await ZB.getApplication(id);$('appNo').textContent='№'+String(a.application_number).padStart(6,'0');$('appTitle').textContent=a.title;$('appStatus').textContent=st[a.status]||a.status;const msgs=await ZB.listMessages(id);$('chat').innerHTML=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===p.id?'citizen':'admin'}"><small>${esc(m.sender_id===p.id?'ВЫ':'ВЕДОМСТВО')} · ${new Date(m.created_at).toLocaleString('ru-RU')}</small><p>${esc(m.message)}</p></div>`).join(''):'<div class="empty">Сообщений пока нет.</div>';await ZB.markApplicationMessagesRead(id)}catch(e){$('chat').innerHTML='<div class="empty">Ошибка: '+esc(e.message)+'</div>'}}$('messageForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,$('message').value.trim());$('message').value='';await load()}catch(err){alert('Не удалось отправить сообщение: '+err.message)}finally{b.disabled=false}};load();</script></body></html>
