<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — ГосПортал</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-12"></script><script src="js/supabase.js?v=20260815-12"></script><style>.page{padding:32px 0}.conversation{max-width:820px;margin:22px auto 0;border:1px solid var(--line);border-radius:18px;background:#0d1522;overflow:hidden}.conversation-head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.conversation-head b,.conversation-head strong{display:block}.conversation-head strong{margin-top:5px}.chat{padding:18px;display:grid;gap:10px;min-height:300px;max-height:60vh;overflow:auto}.message{max-width:78%;padding:11px 13px;border-radius:14px}.message.citizen{justify-self:end;background:#e9edf2;color:#151a22}.message.admin{justify-self:start;background:#182233;border:1px solid #293852}.message small{display:block;font-size:10px;opacity:.65;margin-bottom:5px}.message p{margin:0;white-space:pre-wrap;line-height:1.5}.composer{padding:15px;border-top:1px solid var(--line)}.composer textarea{width:100%;box-sizing:border-box;background:#0a111c;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.composer button{margin-top:8px;width:100%}@media(max-width:600px){.message{max-width:92%}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Переписка</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="dashboard.html">Назад</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="eyebrow">ПЕРЕПИСКА</div><h1>Сообщения</h1><p class="muted">Откройте переписку из карточки заявления. Дата сообщения ставится системой автоматически.</p><section class="conversation"><div class="conversation-head"><div><b id="appNo">Заявление</b><strong id="appTitle">Загрузка…</strong></div><span id="appStatus" class="status status-review">—</span></div><div id="chat" class="chat"><p class="muted">Загрузка…</p></div><form id="messageForm" class="composer"><textarea id="message" rows="4" required maxlength="4000" placeholder="Введите сообщение для ведомства…"></textarea><button class="btn btn-primary" type="submit">Отправить сообщение</button></form></section></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const p=await ZB.requireCitizen();if(!p)return;if(!id){location.href='applications.html';return}logout.onclick=ZB.signOut;try{const a=await ZB.getApplication(id);appNo.textContent='№'+String(a.application_number).padStart(6,'0');appTitle.textContent=a.title;appStatus.textContent=st[a.status]||a.status;const msgs=await ZB.listMessages(id);chat.innerHTML=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===p.id?'citizen':'admin'}"><small>${esc(m.sender_id===p.id?'ВЫ':'ВЕДОМСТВО')} · ${new Date(m.created_at).toLocaleString('ru-RU')}</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Сообщений пока нет.</p>'}catch(e){chat.innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}messageForm.onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,message.value.trim());message.value='';await load()}catch(err){alert(err.message)}finally{b.disabled=false}};load();</script></body></html>
