<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — ГосПортал</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/messages.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">G</span><span><strong>ГосПортал</strong><small>Сообщения</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="dashboard.html">Назад</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="messages-page"><div class="eyebrow">ПЕРЕПИСКА С ВЕДОМСТВОМ</div><h1>Сообщения</h1><p class="muted">Переписка гражданина с ведомством по конкретному заявлению.</p><section class="conversation"><div class="conversation-head"><div><b id="appNo">Заявление</b><strong id="appTitle">Загрузка…</strong></div><span id="appStatus" class="status status-review">—</span></div><div id="chat" class="chat"><p class="muted">Загрузка сообщений…</p></div><form id="messageForm" class="message-form"><textarea id="message" required maxlength="4000" placeholder="Введите сообщение для ведомства..."></textarea><div style="display:flex;gap:10px;align-items:center;justify-content:space-between"><input id="gameDay" required min="0" step="1" type="number" placeholder="Игровой день" style="max-width:180px"><button class="btn btn-primary" type="submit">Отправить</button></div></form></section></main></div><script>const id=new URLSearchParams(location.search).get('id');const st={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const p=await ZB.requireCitizen();if(!p)return;if(!id){location.href='applications.html';return}document.getElementById('logout').onclick=ZB.signOut;try{const a=await ZB.getApplication(id);document.getElementById('appNo').textContent='№'+String(a.application_number).padStart(6,'0');document.getElementById('appTitle').textContent=a.title;document.getElementById('appStatus').textContent=st[a.status]||a.status;const msgs=await ZB.listMessages(id);document.getElementById('chat').innerHTML=msgs.length?msgs.map(m=>`<div class="message ${m.sender_id===p.id?'citizen':'admin'}"><small>${esc(m.sender_id===p.id?'Вы':m.sender_name||'Ведомство')} · ${new Date(m.created_at).toLocaleDateString('ru-RU')} (${esc(m.game_day??'—')} день)</small><p>${esc(m.message)}</p></div>`).join(''):'<p class="muted">Сообщений пока нет.</p>'}catch(e){document.getElementById('chat').innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}document.getElementById('messageForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await ZB.sendMessage(id,document.getElementById('message').value.trim(),document.getElementById('gameDay').value);document.getElementById('message').value='';await load()}catch(err){alert(err.message)}finally{b.disabled=false}};load();</script></body></html>
