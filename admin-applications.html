<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявления — Центр управления</title><link rel="stylesheet" href="redesign-v2/css/admin-v2.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><style>.queue{display:grid;gap:10px}.case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:18px;border:1px solid #28333e;border-radius:15px;background:linear-gradient(180deg,#151e27,#111820)}.case:hover{border-color:#526170}.case-num{font-size:9px;color:#73808e;letter-spacing:.1em;font-weight:900}.case h3{margin:7px 0 5px;font-size:14px}.case-meta{font-size:10px;color:#7f8c9b}.case-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.filterbar{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 16px}.filterbar button{border:1px solid #28333e;background:#111820;color:#9aa7b5;padding:9px 11px;border-radius:9px;font-size:10px;font-weight:800;cursor:pointer}.filterbar button.active{background:#e8edf2;color:#10161c}.search{width:100%;padding:12px;border:1px solid #28333e;border-radius:10px;background:#0b1117;color:#eef2f5;margin-bottom:10px}.empty{padding:48px;text-align:center;border:1px dashed #35414d;border-radius:14px;color:#758292}.modal{position:fixed;inset:0;background:#020508c7;display:grid;place-items:center;padding:20px;z-index:50}.modal[hidden]{display:none}.modal-box{width:min(480px,100%);background:#111820;border:1px solid #344252;border-radius:17px;padding:20px}.modal-box h2{margin:0 0 7px}.modal-box p{color:#7f8c9b;font-size:11px}.modal-box input,.modal-box textarea{width:100%;box-sizing:border-box;margin:7px 0;padding:11px;background:#0b1117;color:#eef2f5;border:1px solid #28333e;border-radius:9px}.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}@media(max-width:700px){.case{grid-template-columns:1fr}.case-actions{justify-content:stretch}.case-actions .v2-btn{flex:1}}
</style></head><body><div class="v2-shell"><header class="v2-top"><a class="v2-brand" href="admin.html"><span class="v2-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Заявления · рабочая очередь</small></span></a><div class="v2-actions"><a class="v2-btn" href="admin.html">Обзор</a><button class="v2-btn" id="logout">Выйти</button></div></header><div class="v2-layout"><aside class="v2-side"><div class="v2-side-label">РАБОТА</div><nav class="v2-nav"><a href="admin.html">Обзор</a><a class="active" href="admin-applications.html">Заявления</a><a href="admin-appeals.html">Оспаривания</a><a href="admin-forms.html">Формы</a><a href="admin-citizens.html">Граждане</a><a href="admin-messages.html">Сообщения</a><a href="admin-service.html">Обслуживание</a></nav></aside><main class="v2-main"><div class="v2-kicker">ДОКУМЕНТООБОРОТ</div><h1 class="v2-title">Заявления</h1><p class="v2-sub">Здесь администратор получает новые дела, начинает рассмотрение и принимает решение. Базовые действия находятся прямо в очереди.</p><input id="q" class="search" placeholder="Поиск по номеру, ФИО, паспорту или названию"><div id="filters" class="filterbar"><button class="active" data-f="all">Все</button><button data-f="submitted">Новые</button><button data-f="received">Получены</button><button data-f="reviewing">Рассмотрение</button><button data-f="approved">Одобрены</button><button data-f="rejected">Отклонены</button><button data-f="postponed">Отложены</button><button data-f="appealed">Оспорены</button></div><div id="list" class="queue"><div class="empty">Загрузка…</div></div></main></div></div><div class="modal" id="modal" hidden><div class="modal-box"><h2 id="mt">Действие</h2><p id="mc"></p><label>Игровой день<input id="day" type="number" min="0" step="1" placeholder="Например, 15"></label><textarea id="comment" rows="5" placeholder="Комментарий / основание"></textarea><div class="modal-actions"><button class="v2-btn" id="cancel">Отмена</button><button class="v2-btn primary" id="confirm">Подтвердить</button></div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const names={submitted:'Новое',received:'Получено',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};let all=[],filter='all',selected=null,action=null;const $=id=>document.getElementById(id);function openAction(a,type){selected=a;action=type;$('mt').textContent=type==='receive'?'Получить заявление':type==='review'?'Начать рассмотрение':type==='approved'?'Одобрить заявление':type==='rejected'?'Отклонить заявление':'Отложить заявление';$('mc').textContent=`№${String(a.application_number||'').padStart(6,'0')} · ${a.title||'Заявление'}`;$('day').value='';$('comment').value='';$('modal').hidden=false;$('day').focus()}function close(){selected=null;action=null;$('modal').hidden=true}$('cancel').onclick=close;async function confirmAction(){try{const d=Number($('day').value);if(!Number.isInteger(d)||d<0)throw Error('Укажите игровой день.');if(action==='receive')await ZB.adminReceive(selected.id,d);else if(action==='review')await ZB.adminStartReview(selected.id,d);else await ZB.decideApplication(selected.id,action,d,$('comment').value.trim());close();all=await ZB.listApplicationsAdmin();render()}catch(e){alert('Не удалось выполнить действие: '+e.message)}}$('confirm').onclick=confirmAction;function buttons(a){let x='';if(a.status==='submitted')x+='<button class="v2-btn primary" data-a="receive">Получить</button>';if(a.status==='received')x+='<button class="v2-btn warn" data-a="review">Начать рассмотрение</button>';if(a.status==='reviewing')x+='<button class="v2-btn good" data-a="approved">Одобрить</button><button class="v2-btn bad" data-a="rejected">Отклонить</button><button class="v2-btn warn" data-a="postponed">Отложить</button>';x+=`<a class="v2-btn" href="admin-application.html?id=${encodeURIComponent(a.id)}">Открыть дело</a>`;return x}function render(){const q=$('q').value.toLowerCase().trim();const x=all.filter(a=>{const p=a.profiles||{};return(filter==='all'||a.status===filter)&&(!q||[a.application_number,a.title,p.full_name,p.passport_series,p.passport_number].join(' ').toLowerCase().includes(q))});$('list').innerHTML=x.length?x.map(a=>{const p=a.profiles||{};const tone=a.status==='approved'?'good':['rejected','cancelled'].includes(a.status)?'bad':'warn';return `<article class="case"><div><div class="case-num">ДЕЛО №${String(a.application_number||'').padStart(6,'0')}</div><h3>${esc(a.title||'Заявление')}</h3><div class="case-meta">${esc(p.full_name||'Гражданин')} · ${esc(p.passport_series||'')} ${esc(p.passport_number||'')} · <span class="v2-status ${tone}">${esc(names[a.status]||a.status)}</span></div></div><div class="case-actions">${buttons(a)}</div></article>`}).join(''):'<div class="empty">Заявлений не найдено.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>openAction(all.find(a=>a.id===b.closest('.case').querySelector('a').href.split('id=')[1]),b.dataset.a))}async function boot(){if(!await ZB.requireAdmin())return;logout.onclick=ZB.signOut;try{all=await ZB.listApplicationsAdmin();render()}catch(e){$('list').innerHTML='<div class="empty">Ошибка загрузки: '+esc(e.message)+'</div>'}}$('q').oninput=render;document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});boot();</script></body></html>
