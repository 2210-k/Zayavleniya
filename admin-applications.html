<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявления — Администрация</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-2"></script><script src="js/supabase.js?v=20260815-2"></script><style>.page{padding:32px 0 60px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{margin:7px 0;font-size:34px}.tools{margin:22px 0;display:flex;gap:10px;flex-wrap:wrap}.tools input{flex:1;min-width:240px}.input,.tools input{background:#0f1725;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#0e1623;color:#aeb9cb;border-radius:10px;padding:9px 12px;cursor:pointer}.filter.active{background:#e8edf5;color:#111827;border-color:#e8edf5}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0f1725;color:var(--text);text-decoration:none}.row:hover{border-color:#46546e}.row b,.row strong,.row small{display:block}.row strong{margin:5px 0}.row small{color:var(--muted)}.status{padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.s-review{background:#2a2415;color:#f4c86a}.s-ok{background:#10281e;color:#6de0a8}.s-bad{background:#30171b;color:#ff9ba4}@media(max-width:650px){.head{display:block}.row{display:block}.row .status{display:inline-block;margin-top:10px}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Заявления</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="admin.html">Обзор</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="head"><div><div class="eyebrow">ДОКУМЕНТООБОРОТ</div><h1>Заявления</h1><p class="muted">Отдельная рабочая очередь. Здесь нет элементов обзора.</p></div></div><div class="tools"><input id="q" placeholder="Поиск по №, ФИО, паспорту или названию"><div class="filters" id="filters"><button class="filter active" data-f="all">Все</button><button class="filter" data-f="submitted">Новые</button><button class="filter" data-f="received">Получены</button><button class="filter" data-f="reviewing">На рассмотрении</button><button class="filter" data-f="approved">Одобрены</button><button class="filter" data-f="rejected">Отклонены</button><button class="filter" data-f="postponed">Отложены</button><button class="filter" data-f="appealed">Оспорены</button></div></div><div id="list" class="list"><p class="muted">Загрузка…</p></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const names={submitted:'Отправлено',received:'Получено ведомством',reviewing:'На рассмотрении',approved:'Одобрено',rejected:'Отклонено',postponed:'Отложено',cancelled:'Отменено',appealed:'Оспорено'};let all=[],filter='all';function render(){const q=document.getElementById('q').value.toLowerCase();const x=all.filter(a=>{const p=a.profiles||{};return(filter==='all'||a.status===filter)&&(!q||[a.application_number,a.title,p.full_name,p.passport_series,p.passport_number].join(' ').toLowerCase().includes(q))});list.innerHTML=x.length?x.map(a=>{const p=a.profiles||{};const cls=['approved'].includes(a.status)?'s-ok':['rejected','cancelled'].includes(a.status)?'s-bad':'s-review';return `<a class="row" href="admin-application.html?id=${a.id}"><div><b>№${String(a.application_number).padStart(6,'0')}</b><strong>${esc(a.title)}</strong><small>${esc(p.full_name||'Гражданин')} · ${esc(p.passport_series||'')} ${esc(p.passport_number||'')} · ${esc(names[a.status]||a.status)}</small></div><span class="status ${cls}">${esc(names[a.status]||a.status)}</span></a>`}).join(''):'<p class="muted">Ничего не найдено.</p>'}async function boot(){if(!await ZB.requireAdmin())return;logout.onclick=ZB.signOut;try{all=await ZB.listApplicationsAdmin();render()}catch(e){list.innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}q.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});boot();</script></body></html>
