<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Граждане — Администрация</title><link rel="stylesheet" href="css/main.css"><script src="js/supabase-config.js?v=20260815-4"></script><script src="js/supabase.js?v=20260815-4"></script><style>.page{padding:32px 0}.head h1{margin:7px 0}.search{width:100%;box-sizing:border-box;margin:20px 0;background:#0f1725;color:#fff;border:1px solid var(--line);padding:13px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:#101826}.card h3{margin:0 0 8px}.card p{margin:5px 0;color:var(--muted);font-size:12px}.passport{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="admin.html"><span class="brand-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Граждане</small></span></a><div class="topbar-actions"><a class="btn btn-secondary" href="admin.html">Обзор</a><button class="btn btn-secondary" id="logout">Выйти</button></div></header><main class="page"><div class="head"><div class="eyebrow">РЕЕСТР</div><h1>Граждане</h1><p class="muted">Поиск по ФИО и паспортным данным.</p></div><input id="q" class="search" placeholder="ФИО, серия или номер паспорта, гражданство"><div id="grid" class="grid"><p class="muted">Загрузка…</p></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let all=[];function render(){const q=document.getElementById('q').value.toLowerCase();const x=all.filter(p=>[p.full_name,p.passport_series,p.passport_number,p.citizenship].join(' ').toLowerCase().includes(q));grid.innerHTML=x.length?x.map(p=>`<article class="card"><h3>${esc(p.full_name||'Без ФИО')}</h3><p>Дата рождения: ${esc(p.birth_date||'—')}</p><div class="passport"><p>Паспорт: <b>${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}</b></p><p>Выдан: ${esc(p.passport_issuer||'—')}</p><p>Дата выдачи: ${esc(p.passport_issue_date||'—')}</p><p>Гражданство: ${esc(p.citizenship||'—')}</p><p>Место рождения: ${esc(p.birth_place||'—')}</p><p>Национальность: ${esc(p.nationality||'—')}</p><p>Проживание: ${esc(p.residence_address||'—')}</p><p>Регистрация: ${esc(p.registration_address||'—')}</p></div></article>`).join(''):'<p class="muted">Граждане не найдены.</p>'}async function boot(){if(!await ZB.requireAdmin())return;logout.onclick=ZB.signOut;try{all=await ZB.listCitizensAdmin();render()}catch(e){grid.innerHTML='<p class="muted">Ошибка: '+esc(e.message)+'</p>'}}q.oninput=render;boot();</script></body></html>
