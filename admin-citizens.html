<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Граждане — Центр управления</title><link rel="stylesheet" href="redesign-v2/css/admin-v2.css"><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><style>.search{width:100%;box-sizing:border-box;padding:12px;background:#0b1117;color:#eef2f5;border:1px solid #28333e;border-radius:10px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.citizen{padding:18px;border:1px solid #28333e;border-radius:15px;background:linear-gradient(180deg,#151e27,#111820)}.citizen h3{margin:0 0 5px;font-size:14px}.meta{font-size:10px;color:#7f8c9b}.data{margin-top:13px;padding:12px;background:#0b1117;border:1px solid #28333e;border-radius:10px;font-size:10px;line-height:1.7}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="v2-shell"><header class="v2-top"><a class="v2-brand" href="admin.html"><span class="v2-mark">G</span><span><strong>ГОСУПОРТАЛ</strong><small>Реестр граждан</small></span></a><div class="v2-actions"><a class="v2-btn" href="admin.html">Обзор</a><button class="v2-btn" id="logout">Выйти</button></div></header><div class="v2-layout"><aside class="v2-side"><div class="v2-side-label">РАБОТА</div><nav class="v2-nav"><a href="admin.html">Обзор</a><a href="admin-applications.html">Заявления</a><a href="admin-appeals.html">Оспаривания</a><a href="admin-forms.html">Формы</a><a class="active" href="admin-citizens.html">Граждане</a><a href="admin-messages.html">Сообщения</a><a href="admin-service.html">Обслуживание</a></nav></aside><main class="v2-main"><div class="v2-kicker">РЕЕСТР</div><h1 class="v2-title">Граждане</h1><p class="v2-sub">Поиск по ФИО и документам. Из карточки можно перейти к заявлениям гражданина или сразу отправить ему форму.</p><input id="q" class="search" placeholder="ФИО, паспорт, гражданство, адрес"><div id="grid" class="grid"><div class="v2-empty">Загрузка…</div></div></main></div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let all=[];const $=id=>document.getElementById(id);function render(){const q=$('q').value.toLowerCase().trim();const x=all.filter(p=>[p.full_name,p.passport_series,p.passport_number,p.citizenship,p.residence_address,p.registration_address].join(' ').toLowerCase().includes(q));$('grid').innerHTML=x.length?x.map(p=>`<article class="citizen"><h3>${esc(p.full_name||'Без ФИО')}</h3><div class="meta">Дата рождения: ${esc(p.birth_date||'—')} · ${esc(p.citizenship||'—')}</div><div class="data"><b>Паспорт:</b> ${esc(p.passport_series||'—')} ${esc(p.passport_number||'—')}<br><b>Выдан:</b> ${esc(p.passport_issuer||'—')} · ${esc(p.passport_issue_date||'—')}<br><b>Место рождения:</b> ${esc(p.birth_place||'—')}<br><b>Проживание:</b> ${esc(p.residence_address||'—')}<br><b>Регистрация:</b> ${esc(p.registration_address||'—')}</div><div class="actions"><a class="v2-btn" href="admin-applications.html?q=${encodeURIComponent(p.full_name||'')}">Заявления</a><a class="v2-btn primary" href="admin-forms.html?citizen_id=${encodeURIComponent(p.id)}">Отправить форму</a></div></article>`).join(''):'<div class="v2-empty">Граждане не найдены.</div>'}async function boot(){if(!await ZB.requireAdmin())return;logout.onclick=ZB.signOut;try{all=await ZB.listCitizensAdmin();render()}catch(e){$('grid').innerHTML='<div class="v2-empty">Ошибка: '+esc(e.message)+'</div>'}}$('q').oninput=render;boot();</script></body></html>
